<title>หอคอยเงา</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one-screen battle stage — turn queue on top, enemies on a stone floor, party row, log, command dock. Single dark "torch-lit tower" look by choice. */
:root{
  --ink:#16131f;        /* page ground */
  --stone:#221d31;      /* panels */
  --stone-2:#2e2742;    /* raised panels */
  --edge:#4a4066;       /* borders */
  --parch:#efe7d4;      /* main text */
  --dim:#a9a1be;        /* secondary text */
  --gold:#e9b44c;       /* accent */
  --gold-ink:#2a1e08;   /* text on gold */
  --hp:#e0625a; --mp:#5ea8e4; --good:#7cc66c; --bad:#c86ad0; --warn:#f0a040;
  --f-display:'Mitr','Sarabun',system-ui,sans-serif;
  --f-body:'Sarabun','Mitr',system-ui,sans-serif;
  --f-num:'Silkscreen','Mitr',ui-monospace,monospace;
  --scene:#1d2a2a;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--parch);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:8px;box-sizing:border-box}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.floor{font-family:var(--f-display);font-weight:500;font-size:16px;line-height:1.2;flex:1;min-width:0}
.floor small{display:block;font-weight:400;font-size:12px;color:var(--dim);font-family:var(--f-body)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);background:var(--stone);border-radius:6px;padding:6px 10px;font-size:13px}
.chip.on{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.coin{width:10px;height:10px;background:var(--gold);border-radius:50%;box-shadow:inset -2px -2px 0 var(--gold-ink)}
.num{font-family:var(--f-num);font-size:11px;letter-spacing:.02em}

/* turn queue */
.queue{display:flex;align-items:center;gap:6px;overflow-x:auto;scrollbar-width:none;min-height:34px}
.queue::-webkit-scrollbar{display:none}
.queue .lbl{font-size:11px;color:var(--dim);letter-spacing:.06em;white-space:nowrap}
.q{flex:none;width:30px;height:30px;border-radius:6px;background:var(--stone);border:1px solid var(--edge);display:grid;place-items:center}
.q img{width:24px;height:24px;image-rendering:pixelated}
.q.hero{border-color:#5f7fb0}
.q.now{border-color:var(--gold);background:var(--stone-2);outline:2px solid var(--gold)}

/* stage */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;background:var(--scene);border:1px solid var(--edge);border-radius:10px;position:relative;overflow:hidden;padding:10px 8px 8px}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:46%;pointer-events:none;
  background-image:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.18) 2px,transparent 2px);background-size:32px 16px;opacity:.7}
.foes,.party{display:flex;justify-content:center;align-items:flex-end;gap:6px;position:relative;z-index:1}
.party{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

.unit{position:relative;background:none;border:2px solid transparent;border-radius:8px;padding:4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;text-align:center;transition:transform .15s}
.unit .spr{image-rendering:pixelated;display:block}
.foe .spr{width:72px;height:72px}
.foe.big .spr{width:128px;height:128px}
.foe .nm{font-size:12px;color:var(--parch);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.foe .bar{width:72px}
.foe.big .bar{width:120px}
.hero{background:var(--stone);border-color:var(--edge);flex-direction:row;align-items:center;gap:6px;padding:6px;text-align:left}
.hero .spr{width:40px;height:40px;flex:none}
.hero .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hero .nm{font-family:var(--f-display);font-size:13px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .nm .num{color:var(--gold);font-size:10px}
.bar{height:6px;background:#0d0b14;border-radius:3px;overflow:hidden;width:100%}
.bar i{display:block;height:100%;width:100%;background:var(--hp);transition:width .35s}
.bar.mp i{background:var(--mp)}
.bar.low i{background:#ff7b4a}
.vals{display:flex;justify-content:space-between;gap:4px;color:var(--dim)}
.sts{display:flex;flex-wrap:wrap;gap:3px;min-height:14px;justify-content:center}
.hero .sts{justify-content:flex-start}
.st{font-size:10px;line-height:14px;padding:0 4px;border-radius:3px;background:var(--stone-2);color:var(--parch);border:1px solid var(--edge)}
.st.bad{border-color:var(--bad);color:#f0c4f4}
.st.good{border-color:var(--good);color:#d0f0c8}
.st.charge{border-color:var(--warn);color:var(--warn)}

.unit.now{border-color:var(--gold)}
.foe.now{background:rgba(233,180,76,.08)}
.unit.dead{opacity:.35;filter:grayscale(1)}
.foe.dead{opacity:0;pointer-events:none;transition:opacity .5s}
.unit.tgt{border-color:var(--gold);border-style:dashed;cursor:pointer;animation:pulse 1s ease-in-out infinite}
.unit.lunge.foe{animation:lungeDown .3s}
.unit.lunge.hero{animation:lungeUp .3s}
.unit.cast .spr{animation:cast .45s}
.unit.hurt .spr{animation:hurt .35s}
@keyframes pulse{50%{transform:translateY(-3px)}}
@keyframes lungeUp{50%{transform:translateY(-14px)}}
@keyframes lungeDown{50%{transform:translateY(14px)}}
@keyframes cast{30%{transform:scale(1.12)}60%{transform:scale(.96)}}
@keyframes hurt{0%,100%{transform:none;filter:none}20%{transform:translateX(-5px);filter:brightness(2.4)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.pop{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-family:var(--f-num);font-weight:700;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 0 #000;pointer-events:none;white-space:nowrap;animation:pop 1s ease-out forwards;z-index:5}
.pop.heal{color:var(--good)}
.pop.mp{color:var(--mp)}
.pop.crit{color:var(--gold);font-size:22px}
.pop.txt{font-family:var(--f-display);font-weight:500;font-size:13px;color:var(--parch)}
.pop.weak{font-family:var(--f-display);font-size:12px;color:var(--warn);top:2%}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px)}15%{opacity:1;transform:translate(-50%,-8px)}100%{opacity:0;transform:translate(-50%,-30px)}}

/* log + commands */
.log{background:var(--stone);border:1px solid var(--edge);border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.45;min-height:58px;color:var(--dim)}
.log p{margin:0}
.log p:last-child{color:var(--parch)}
.log b{color:var(--gold);font-weight:600}
.cmd{background:var(--stone);border:1px solid var(--edge);border-radius:10px;padding:8px;min-height:132px;display:flex;flex-direction:column;gap:6px}
.cmd .who{font-family:var(--f-display);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.cmd .who span{color:var(--dim);font-size:12px;font-family:var(--f-body)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.btn{background:var(--stone-2);border:1px solid var(--edge);border-radius:8px;padding:10px;text-align:left;font-family:var(--f-display);font-size:15px;line-height:1.2;display:flex;flex-direction:column;gap:2px;min-height:44px}
.btn small{font-family:var(--f-body);font-size:11.5px;color:var(--dim);font-weight:400}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.main{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.main small{color:#5a4210}
.btn .cost{font-family:var(--f-num);font-size:10px;color:var(--mp)}
.list{display:flex;flex-direction:column;gap:6px;max-height:168px;overflow-y:auto}
.list .btn{flex-direction:row;justify-content:space-between;align-items:center;gap:8px}
.list .btn > div{display:flex;flex-direction:column;gap:2px;min-width:0}
.back{align-self:flex-start;background:none;border:1px solid var(--edge);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--dim)}
.wait{color:var(--dim);font-size:14px;display:flex;align-items:center;justify-content:center;flex:1}

/* overlay screens */
.ov{position:fixed;inset:0;z-index:20;background:var(--ink);overflow-y:auto;-webkit-overflow-scrolling:touch}
.ov .in{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(28px + env(safe-area-inset-top,0px)) calc(32px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.12em;color:var(--gold)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:clamp(44px,12vw,72px);line-height:1;font-weight:600;letter-spacing:.01em}
h2{font-size:26px;line-height:1.2}
h3{font-size:16px;color:var(--dim);font-weight:400}
.lead{margin:0;color:var(--dim);font-size:16px;line-height:1.6;max-width:34em}
.title-art{display:flex;gap:4px;align-items:flex-end}
.title-art img{image-rendering:pixelated;width:64px;height:64px}
.title-art img.drg{width:120px;height:120px;margin-left:auto}
.stack{display:flex;flex-direction:column;gap:8px}
.ov .btn{padding:14px;font-size:16px}
details{background:var(--stone);border:1px solid var(--edge);border-radius:8px;padding:10px 14px}
summary{cursor:pointer;font-family:var(--f-display)}
details ul{margin:10px 0 2px;padding-left:20px;line-height:1.7;color:var(--dim)}
details li b{color:var(--parch);font-weight:600}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.mini{background:var(--stone);border:1px solid var(--edge);border-radius:8px;padding:8px;display:flex;gap:8px;align-items:center}
.mini img{width:40px;height:40px;image-rendering:pixelated}
.mini .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mini.ko img{filter:grayscale(1);opacity:.5}
.rew{background:var(--stone);border:1px solid var(--edge);border-radius:8px;padding:10px 14px;line-height:1.7}
.rew b{color:var(--gold)}
.rew .up{color:var(--good)}
.shop{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--stone);border:1px solid var(--edge);border-radius:8px;padding:8px 10px}
.row .d{flex:1;min-width:0}
.row .d div{font-family:var(--f-display)}
.row .d small{color:var(--dim)}
.row .own{color:var(--dim);font-size:12px;white-space:nowrap}
.buy{background:var(--stone-2);border:1px solid var(--gold);border-radius:6px;padding:8px 10px;font-size:13px;white-space:nowrap}
.buy:disabled{opacity:.4;border-color:var(--edge)}
.note{margin:0;color:var(--good);font-size:14px}
.warn{margin:0;color:var(--warn);font-size:14px}
.big-msg{font-size:15px;color:var(--dim);line-height:1.6;margin:0}

@media (max-width:520px){
  .floor{flex-basis:100%}
  .floor small{display:none}
  .top .chip{padding:5px 9px}
}
@media (max-width:420px){
  .foe .spr{width:60px;height:60px}.foe .bar{width:60px}
  .foe.big .spr{width:112px;height:112px}
  .hero{flex-direction:column;align-items:stretch;text-align:center}
  .hero .spr{width:36px;height:36px;margin:0 auto}
  .hero .sts{justify-content:center}
  .btn{font-size:14px;padding:9px}
}
@media (min-height:820px){.cmd{min-height:150px}.foe .spr{width:84px;height:84px}.foe.big .spr{width:150px;height:150px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition:none!important}}
</style>

</div>
<div class="ov" id="ov" hidden><div class="in" id="ovIn"></div></div>

/* ---------- combat math ---------- */
function calc(a,t,sk){
  const am=a.st.atkUp>0?1.3:1;let base,crit=false;
  if(sk.kind==='phys'){
    if(Math.random()<.04)return{miss:true};
    const raw=a.atk*am*sk.pow*rnd(.9,1.1);
    base=Math.max(raw*.2,raw-t.def*.5*(1-(sk.pierce||0)));
    if(Math.random()<.08){crit=true;base*=1.5;}
  }else{
    const raw=(sk.flatDmg||a.mag*am*sk.pow)*rnd(.92,1.08);
    base=Math.max(raw*.25,raw-t.mdef*.4);
    if(!sk.flatDmg&&Math.random()<.05){crit=true;base*=1.5;}
  }
  let m=1,tag='';
  if(sk.elem&&t.weak.includes(sk.elem)){m*=1.5;tag='weak';}
  else if(sk.elem&&t.resist.includes(sk.elem)){m*=.5;tag='resist';}
  if(t.defending)m*=.5;
  if(t.st.defUp>0)m*=.6;
  return{dmg:Math.max(1,Math.round(base*m)),crit,tag};
}
function hurt(t,d){t.hp=Math.max(0,t.hp-d);if(t.hp===0){t.st=freshSt();t.defending=false;if(t.side==='enemy')G.stats.kills++;}}
function tryInflict(t,[s,ch,n]){
  let c=ch;if(t.boss&&(s==='stun'||s==='slow'))c*=.4;
  if(s==='burn'&&t.resist.includes('fire'))return false;
  if(Math.random()<c){t.st[s]=Math.max(t.st[s],n);return true;}return false;
}
function healAmt(u,sk){return Math.round(u.mag*sk.pow*rnd(.95,1.05)+(sk.flat||0));}

async function useSkill(u,sk,targets){
  if(sk.mp)u.mp-=sk.mp;
  paintUnit(u);
  log(sk===SK.hit?`${u.name} โจมตี`:`${u.name} ใช้ <b>${sk.name}</b>`);
  anim(u,sk.kind==='phys'?'lunge':'cast');
  await sleep(300);
  const parts=[];
  if(sk.kind==='phys'||sk.kind==='mag'){
    for(const t of targets){
      if(t.hp<=0)continue;
      const r=calc(u,t,sk);
      if(r.miss){pop(t,'พลาด','txt');parts.push(`${t.name} หลบได้`);continue;}
      hurt(t,r.dmg);anim(t,'hurt');pop(t,r.dmg,r.crit?'crit':'');
      if(r.tag==='weak')pop(t,'จุดอ่อน!','weak');
      if(r.tag==='resist')pop(t,'ต้านทาน','weak');
      let p=`${t.name} -${r.dmg}${r.crit?' (คริติคอล)':''}`;
      if(sk.drain&&u.hp>0){const h=Math.round(r.dmg*sk.drain);u.hp=Math.min(u.maxhp,u.hp+h);pop(u,'+'+h,'heal');paintUnit(u);}
      if(t.hp<=0)p+=' ล้มแล้ว';
      else if(sk.inflict&&tryInflict(t,sk.inflict))p+=` ติด${STL[sk.inflict[0]][0]}`;
      parts.push(p);paintUnit(t);
    }
  }else if(sk.kind==='heal'){
    for(const t of targets){if(t.hp<=0)continue;const h=healAmt(u,sk);t.hp=Math.min(t.maxhp,t.hp+h);if(sk.cleanse)BAD.forEach(s=>t.st[s]=0);pop(t,'+'+h,'heal');paintUnit(t);parts.push(`${t.name} +${h}`);}
  }else if(sk.kind==='revive'){
    for(const t of targets){if(t.hp>0)continue;t.hp=Math.round(t.maxhp*sk.pow);pop(t,'ฟื้นคืนชีพ','txt');paintUnit(t);parts.push(`${t.name} กลับมาสู้ต่อ`);}
  }else if(sk.kind==='buff'){
    for(const t of targets){for(const[s,n]of sk.st)t.st[s]=Math.max(t.st[s],n);paintUnit(t);}
    if(sk===SK.charge)parts.push('<b>มังกรกำลังสูดพลัง!</b> เทิร์นหน้าจะพ่นลมหายใจใส่ทุกคน กดป้องกันไว้');
    else if(sk===SK.enrage)parts.push('มังกรคลั่ง พลังโจมตีเพิ่มขึ้นถาวร');
    else if(sk===SK.guard)parts.push(`ศัตรูจะพุ่งเป้ามาที่${u.name}`);
    else parts.push('พลังโจมตีเพิ่มขึ้น');
  }else if(sk.kind==='summon'){
    const e=makeEnemy('goblin');B.enemies.push(e);B.summons++;nameDupes();$('#foes').appendChild(unitEl(e));B.enemies.forEach(paintUnit);pop(e,'มาแล้ว','txt');parts.push('โกบลินตัวใหม่วิ่งเข้ามา');
  }
  if(parts.length)log(parts.join(' · '));
  await sleep(560);
}

function makeEnemy(key){
  const d=EDEF[key];
  return{uid:'e'+(++B.uidc),key,side:'enemy',name:d.name,base:d.name,spr:key,maxhp:d.hp,hp:d.hp,mp:0,maxmp:0,atk:d.atk,mag:d.mag||Math.round(d.atk*.7),def:d.def,mdef:d.mdef,spd:d.spd,weak:d.weak||[],resist:d.resist||[],boss:!!d.boss,big:!!d.big,acts:d.acts,ai:d.ai,xp:d.xp,gold:d.gold,st:freshSt()};
}
function nameDupes(){
  const cnt={};B.enemies.forEach(e=>cnt[e.base]=(cnt[e.base]||0)+1);
  const seen={};B.enemies.forEach(e=>{if(cnt[e.base]>1){seen[e.base]=(seen[e.base]||0)+1;e.name=e.base+' '+'กขคงจฉ'[seen[e.base]-1];}else e.name=e.base;});
}
function pickHero(){
  const al=aliveFoes('hero');
  const t=al.filter(h=>h.st.taunt>0);
  if(t.length&&Math.random()<.75)return t[0];
  if(Math.random()<.3)return al.slice().sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp)[0];
  return al[Math.floor(Math.random()*al.length)];
}
async function enemyTurn(u){
  await sleep(380);
  const id=u.ai?u.ai(u):wpick(u.acts);
  const sk=SK[id];
  let targets;
  if(sk.tgt==='foe')targets=[pickHero()];
  else if(sk.tgt==='allFoes')targets=foesOf(u);
  else if(sk.tgt==='allAllies')targets=alliesOf(u);
  else targets=[u];
  await useSkill(u,sk,targets);
}

  $('#a-sk').onclick=showSkills;
  $('#a-def').onclick=()=>finish({type:'defend'});

function showSkills(){
  const u=UI.actor,c=$('#cmd');
  c.innerHTML=cmdHead(u,'เลือกสกิล')+`<div class="list">${HDEF[u.key].skills.map(id=>{const s=SK[id];const lock=u.lv<s.lv;return `<button class="btn" data-sk="${id}" ${canUse(u,id)?'':'disabled'}><div>${s.name}<small>${lock?'ปลดล็อกที่เลเวล '+s.lv:s.desc}</small></div><span class="cost">${s.mp} MP</span></button>`;}).join('')}</div><button class="back" id="bk">ย้อนกลับ</button>`;
  c.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.sk,s=SK[id];
    if(s.tgt==='allFoes'||s.tgt==='allAllies'||s.tgt==='self')finish({type:'skill',id});
    else if(s.tgt==='deadAlly'&&!deadAlliesOf(u).length){log('ยังไม่มีเพื่อนที่ล้ม');}
    else pickTarget(s.tgt,t=>finish({type:'skill',id,targets:[t]}),s.tgt==='foe'?'เลือกศัตรู':'เลือกเพื่อน',showSkills);
  });
  $('#bk').onclick=showMain;
}
function showItems(){
  const u=UI.actor,c=$('#cmd');
  const ids=Object.keys(ITEMS).filter(k=>G.items[k]>0);
  c.innerHTML=cmdHead(u,'เลือกไอเทม')+`<div class="list">${ids.map(k=>`<button class="btn" data-it="${k}"><div>${ITEMS[k].name}<small>${ITEMS[k].desc}</small></div><span class="num">x${G.items[k]}</span></button>`).join('')}</div><button class="back" id="bk">ย้อนกลับ</button>`;
  c.querySelectorAll('[data-it]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.it,it=ITEMS[id];
    if(it.tgt==='allFoes')finish({type:'item',id});
    else if(it.tgt==='deadAlly'&&!deadAlliesOf(u).length)log('ยังไม่มีเพื่อนที่ล้ม');
    else pickTarget(it.tgt,t=>finish({type:'item',id,target:t}),'เลือกเพื่อนที่จะใช้',showItems);
  });
  $('#bk').onclick=showMain;
}
function pickTarget(kind,onPick,label,back){
  const u=UI.actor;
  const list=kind==='foe'?foesOf(u):kind==='ally'?alliesOf(u):deadAlliesOf(u);
  clearTargets();list.forEach(t=>EL[t.uid]&&EL[t.uid].classList.add('tgt'));
  UI.pick=onPick;
  $('#cmd').innerHTML=cmdHead(u,label)+`<div class="wait">แตะที่ตัวละครบนฉาก</div><button class="back" id="bk">ย้อนกลับ</button>`;
  $('#bk').onclick=()=>{UI.pick=null;clearTargets();(back||showMain)();};
}
async function useItem(u,id,target){
  const it=ITEMS[id];G.items[id]--;
  log(`${u.name} ใช้ <b>${it.name}</b>`);anim(u,'cast');await sleep(300);
  if(id==='potion'){const h=Math.max(60,Math.round(target.maxhp*.4));target.hp=Math.min(target.maxhp,target.hp+h);pop(target,'+'+h,'heal');}
  else if(id==='ether'){target.mp=Math.min(target.maxmp,target.mp+25);pop(target,'+25','mp');}
  else if(id==='remedy'){BAD.forEach(s=>target.st[s]=0);pop(target,'หายดี','txt');}
  else if(id==='phoenix'){target.hp=Math.round(target.maxhp*.5);pop(target,'ฟื้นคืนชีพ','txt');}
  else if(id==='firebomb'){const parts=[];for(const t of foesOf(u)){const r=calc(u,t,{kind:'mag',flatDmg:45,elem:'fire'});hurt(t,r.dmg);anim(t,'hurt');pop(t,r.dmg);if(r.tag==='weak')pop(t,'จุดอ่อน!','weak');paintUnit(t);parts.push(`${t.name} -${r.dmg}`);}log(parts.join(' · '));}
  if(target)paintUnit(target);
  await sleep(560);
}

/* auto battle for heroes */
function autoAction(u){
  const foes=foesOf(u),al=alliesOf(u),dead=deadAlliesOf(u);
  const has=id=>HDEF[u.key].skills.includes(id)&&canUse(u,id);
  const byHp=foes.slice().sort((a,b)=>a.hp-b.hp);
  const weakTo=el=>foes.find(f=>f.weak.includes(el));
  const charged=B.enemies.some(e=>e.hp>0&&e.st.charge>0);
  if(u.key==='cleric'){
    if(dead.length&&has('revive'))return{type:'skill',id:'revive',targets:[dead[0]]};
    if(dead.length&&G.items.phoenix>0)return{type:'item',id:'phoenix',target:dead[0]};
    const low=al.filter(a=>a.hp/a.maxhp<.55);
    if(low.length>=2&&has('bless'))return{type:'skill',id:'bless'};
    if(low.length&&has('heal'))return{type:'skill',id:'heal',targets:[low.sort((a,b)=>a.hp/a.maxhp-b.hp/b.maxhp)[0]]};
    if(charged)return{type:'defend'};
    if(u.mp<10&&G.items.ether>0)return{type:'item',id:'ether',target:u};
    if(has('holy')&&u.mp>24)return{type:'skill',id:'holy',targets:[weakTo('holy')||byHp[0]]};
    return{type:'skill',id:'hit',targets:[byHp[0]]};
  }
  if(u.hp/u.maxhp<.3&&G.items.potion>0)return{type:'item',id:'potion',target:u};
  if(charged)return{type:'defend'};
  if(u.key==='knight'){
    const anyTaunt=al.some(a=>a.st.taunt>0);
    if(!anyTaunt&&al.some(a=>a!==u&&a.hp/a.maxhp<.4)&&has('guard'))return{type:'skill',id:'guard'};
    if(foes.length>=2&&has('cleave'))return{type:'skill',id:'cleave'};
    const big=foes.slice().sort((a,b)=>b.hp-a.hp)[0];
    if(has('smite')&&big.hp>50)return{type:'skill',id:'smite',targets:[big]};
    return{type:'skill',id:'hit',targets:[byHp[0]]};
  }
  // mage
  if(foes.length>=2&&has('frost'))return{type:'skill',id:'frost'};
  if(has('bolt'))return{type:'skill',id:'bolt',targets:[weakTo('thunder')||foes.slice().sort((a,b)=>b.hp-a.hp)[0]]};
  if(has('fire'))return{type:'skill',id:'fire',targets:[weakTo('fire')||byHp[0]]};
  if(G.items.ether>0)return{type:'item',id:'ether',target:u};
  return{type:'skill',id:'hit',targets:[byHp[0]]};
}

/* ---------- battle loop ---------- */
async function heroTurn(u){
  const act=await chooseAction(u);
  if(act.type==='defend'){u.defending=true;u.mp=Math.min(u.maxmp,u.mp+4);paintUnit(u);log(`${u.name} ตั้งท่าป้องกัน`);pop(u,'ป้องกัน','txt');await sleep(450);return;}
  if(act.type==='item'){await useItem(u,act.id,act.target);return;}
  const sk=SK[act.id];
  let targets=act.targets;
  if(sk.tgt==='allFoes')targets=foesOf(u);
  else if(sk.tgt==='allAllies')targets=alliesOf(u);
  else if(sk.tgt==='self')targets=[u];
  await useSkill(u,sk,targets);
}
async function takeTurn(u){
  setNow(u);paintQueue();G.stats.turns++;
  for(const s of['burn','poison']){
    if(u.st[s]>0){
      const d=Math.max(3,Math.round(u.maxhp*(s==='burn'?.06:.07)));
      u.st[s]--;hurt(u,d);anim(u,'hurt');pop(u,d);paintUnit(u);
      log(`${u.name} ${s==='burn'?'โดนไฟไหม้':'โดนพิษ'} -${d}${u.hp<=0?' ล้มแล้ว':''}`);
      await sleep(480);if(u.hp<=0)return;
    }
  }
  u.defending=false;paintUnit(u);
  if(u.st.stun>0){u.st.stun--;pop(u,'มึนงง','txt');log(`${u.name} มึนงง ข้ามเทิร์น`);paintUnit(u);await sleep(520);endTurn(u);return;}
  if(u.side==='hero')await heroTurn(u);else{showWait(u);await enemyTurn(u);}
  endTurn(u);
}
function endTurn(u){for(const k of['slow','defUp','taunt','atkUp','charge'])if(u.st[k]>0&&u.st[k]<90)u.st[k]--;paintUnit(u);}
function result(){if(!aliveFoes('enemy').length)return'win';if(!aliveFoes('hero').length)return'lose';return null;}

async function runBattle(){
  const f=FLOORS[G.floor-1];
  B={enemies:[],uidc:0,summons:0,round:0,order:[],qi:0,log:[],xp:0,gold:0};
  G.party.forEach((h,i)=>{h.uid='h'+i;h.st=freshSt();h.defending=false;});
  f.foes.forEach(k=>B.enemies.push(makeEnemy(k)));nameDupes();
  buildField();$('#log').innerHTML='';
  log(f.boss?`<b>บอสปรากฏตัว!</b> ${B.enemies.find(e=>e.boss).name} ขวางทางอยู่`:`ศัตรูโผล่มา ${B.enemies.length} ตัว`);
  showWait();
  await sleep(500);
  while(true){
    B.round++;
    B.order=[...aliveFoes('hero'),...aliveFoes('enemy')].map(u=>({u,k:u.spd*(u.st.slow>0?.5:1)*rnd(.85,1.15)})).sort((a,b)=>b.k-a.k).map(o=>o.u);
    for(B.qi=0;B.qi<B.order.length;B.qi++){
      const u=B.order[B.qi];if(u.hp<=0)continue;
      await takeTurn(u);
      const r=result();if(r){setNow(null);return r;}
    }
  }
}

/* ---------- flow ---------- */
async function startFloor(){
  hideOv();G.phase='battle';save();
  const r=await runBattle();
  await sleep(600);
  if(r==='win')onWin();else showLose();
}
function onWin(){
  const xp=B.enemies.reduce((s,e)=>s+e.xp,0),gold=B.enemies.reduce((s,e)=>s+e.gold,0);
  G.gold+=gold;
  const ups=[];
  G.party.forEach(h=>{
    h.st=freshSt();h.defending=false;
    let gain=h.hp>0?xp:Math.floor(xp/2);h.xp+=gain;
    while(h.xp>=xpNeed(h.lv)){
      h.xp-=xpNeed(h.lv);const om=h.maxhp,omp=h.maxmp;h.lv++;applyLevel(h);
      if(h.hp>0){h.hp+=h.maxhp-om;h.mp+=h.maxmp-omp;}
      const newSk=HDEF[h.key].skills.filter(id=>SK[id].lv===h.lv).map(id=>SK[id].name);
      ups.push(`${h.name} เลเวล ${h.lv}${newSk.length?' · ได้สกิลใหม่ '+newSk.join(', '):''}`);
    }
  });
  const done=G.floor;
  if(done>=10){G.phase='end';clearSave();showEnd();return;}
  G.floor++;G.phase='camp';G.choiceUsed=false;G.last={floor:done,xp,gold,ups};save();
  showCamp();
}

    <details open><summary>สถานะทีม</summary><div class="minis" style="margin-top:10px">${G?G.party.map(miniHero).join(''):''}</div></details>`);
  $('#m-back').onclick=hideOv;
  $('#m-title').onclick=()=>location.reload();
};

function start(){showTitle();}
window.claude?.hot?.snapshot?.(()=>({}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
