<title>Iron Protocol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: HUD cockpit — one-screen game grid (enemy row / command strip / own row / hand), menus are stacked panels. Deliberately single dark theme. */
:root{
  color-scheme:dark;
  --bg:#080c12; --panel:#101823; --panel2:#162130; --line:#26364a; --fg:#e4ecf5; --dim:#8396ad;
  --accent:#8fb3ff; --hp:#ff5470; --atk:#ffb648; --ok:#5ee0a0;
  --plasma:#ff6b3d; --cryo:#4fd2ff; --volt:#ffd23f; --neutral:#a8b5c6;
  --art-bg:#0c131d; --mech:#c3cfdd; --mech2:#6f8199;
  --display:"Chakra Petch","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Chakra Petch",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden;
  background-image:radial-gradient(ellipse at 50% -10%,#14233a 0%,transparent 60%),linear-gradient(var(--bg),var(--bg))}
#app{height:100%;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));box-sizing:border-box}
button{font-family:var(--display);cursor:pointer;color:var(--fg)}
button:focus-visible,[data-act]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:12px 18px;font-size:16px;font-weight:600;letter-spacing:.03em;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#06101f;border-color:var(--accent)}
.btn.warn{border-color:var(--hp);color:var(--hp)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:8px 12px;font-size:14px}
.label{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px}
select{font-family:var(--body);font-size:16px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px;max-width:100%}
input[type=text]{font-family:var(--body);font-size:16px;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px;min-width:0}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.ico{width:1em;height:1em;vertical-align:-.12em;fill:currentColor}

/* ---------- MENU ---------- */
.hero{display:flex;flex-direction:column;gap:6px;padding-block:28px 8px}
.hero h1{font-size:clamp(40px,9vw,76px);font-weight:700;letter-spacing:.04em;line-height:.95}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--dim);margin:0;font-size:16px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.menu-item{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:6px;font-family:var(--body)}
.menu-item:hover{border-color:var(--accent)}
.menu-item b{font-family:var(--display);font-size:20px}
.menu-item small{color:var(--dim);font-size:14px}
.fan{display:flex;justify-content:center;gap:0;padding-block:10px;overflow:hidden}
.fan .card{width:min(26vw,150px);flex:none;margin:0 -14px;box-shadow:0 10px 30px #0008}
.fan .card:nth-child(1){transform:rotate(-12deg) translateY(16px)}
.fan .card:nth-child(2){transform:rotate(-4deg) translateY(2px);z-index:1}
.fan .card:nth-child(3){transform:rotate(4deg) translateY(2px);z-index:2}
.fan .card:nth-child(4){transform:rotate(12deg) translateY(16px)}
.stats{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim)}
.stats b{color:var(--fg);font-family:var(--display);font-size:18px}

/* ---------- CARD (full) ---------- */
.card{--fc:var(--neutral);container-type:inline-size;aspect-ratio:5/7;position:relative;border-radius:7px;overflow:hidden;
  background:linear-gradient(170deg,var(--panel2),var(--panel) 60%);border:1px solid color-mix(in srgb,var(--fc) 55%,var(--line));
  display:flex;flex-direction:column;box-sizing:border-box;user-select:none;-webkit-user-select:none}
.card.r-SR{box-shadow:0 0 0 1px color-mix(in srgb,var(--fc) 60%,transparent),0 0 14px color-mix(in srgb,var(--fc) 30%,transparent)}
.card.r-UR{border-color:var(--fc);box-shadow:0 0 0 2px color-mix(in srgb,var(--fc) 70%,transparent),0 0 22px color-mix(in srgb,var(--fc) 45%,transparent)}
.card.r-UR::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff22 45%,transparent 60%);background-size:250% 100%;animation:foil 3.5s linear infinite;pointer-events:none}
@keyframes foil{from{background-position:120% 0}to{background-position:-120% 0}}
.c-head{display:flex;align-items:center;gap:3cqw;padding:3.5cqw 4cqw 2cqw}
.c-cost{flex:none;width:15cqw;height:15cqw;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:10cqw;color:#06101f;background:var(--accent);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.c-name{font-family:var(--display);font-weight:700;font-size:7.6cqw;line-height:1.05;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-art{margin:0 4cqw;border-radius:2.5cqw;overflow:hidden;border:1px solid var(--line);aspect-ratio:100/62}
.c-art svg{display:block;width:100%;height:100%}
.c-type{display:flex;justify-content:space-between;padding:2cqw 4cqw 0;font-size:5.4cqw;color:var(--dim);font-family:var(--display);letter-spacing:.04em}
.c-type .rar{color:var(--fc);font-weight:700}
.c-kw{display:flex;flex-wrap:wrap;gap:1.5cqw;padding:2cqw 4cqw 0}
.chip{font-size:5cqw;font-family:var(--display);font-weight:600;padding:.6cqw 2.2cqw;border-radius:9cqw;border:1px solid color-mix(in srgb,var(--fc) 60%,var(--line));color:var(--fg);background:color-mix(in srgb,var(--fc) 14%,transparent);white-space:nowrap}
.c-text{flex:1;padding:2cqw 4cqw 0;font-size:6cqw;line-height:1.35;color:var(--fg);overflow:hidden}
.c-stats{display:flex;justify-content:space-between;padding:0 3cqw 3cqw}
.st{min-width:15cqw;height:12cqw;padding:0 2cqw;box-sizing:border-box;display:flex;align-items:center;justify-content:center;gap:1cqw;font-family:var(--display);font-weight:700;font-size:8.5cqw;border-radius:2cqw;font-variant-numeric:tabular-nums}
.st.a{background:color-mix(in srgb,var(--atk) 22%,var(--panel));color:var(--atk);border:1px solid color-mix(in srgb,var(--atk) 50%,transparent)}
.st.h{background:color-mix(in srgb,var(--hp) 22%,var(--panel));color:#ff8fa2;border:1px solid color-mix(in srgb,var(--hp) 50%,transparent)}
.card.mini .c-text{display:none}
.card.mini .c-kw{flex:1;align-content:flex-start}
.card.mini .c-type{font-size:6cqw}
.card.mini .c-type .fac{display:none}
.card.unplayable{filter:saturate(.35) brightness(.7)}
.card.playable{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 0 12px color-mix(in srgb,var(--ok) 40%,transparent)}
.card.locked{filter:grayscale(1) brightness(.45)}
.cback{aspect-ratio:5/7;border-radius:5px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,#142033 0 6px,#0f1928 6px 12px);position:relative}
.cback::after{content:"IP";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--mech2);font-size:12px}

/* ---------- GAME ---------- */
.game{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:6px;padding-block:6px;box-sizing:border-box}
.pbar{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;min-height:44px;box-sizing:border-box}
.pbar .who{font-family:var(--display);font-weight:700;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pbar .who small{display:block;font-weight:500;color:var(--dim);font-size:11px;letter-spacing:.1em}
.core{display:flex;align-items:center;gap:6px;padding:4px 10px;border-radius:4px;border:1px solid color-mix(in srgb,var(--hp) 50%,var(--line));background:color-mix(in srgb,var(--hp) 12%,var(--panel));
  font-family:var(--display);font-weight:700;font-size:20px;color:#ff8fa2;position:relative;font-variant-numeric:tabular-nums}
.core.tgt{outline:2px solid var(--hp);box-shadow:0 0 16px var(--hp);cursor:pointer;animation:pulse 1s infinite}
.en{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;color:var(--volt);font-size:17px}
.pips{display:flex;gap:2px}
.pip{width:6px;height:14px;border-radius:1px;background:#2a3446}
.pip.on{background:var(--volt);box-shadow:0 0 6px color-mix(in srgb,var(--volt) 60%,transparent)}
.meta{display:flex;gap:10px;color:var(--dim);font-family:var(--display);font-size:14px;align-items:center}
.traps{display:flex;gap:4px}
.trapc{width:22px;height:30px;border-radius:3px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,#2a1d33 0 4px,#1b1426 4px 8px);display:grid;place-items:center;font-family:var(--display);font-size:11px;color:#c99cff}
.trapc.mine{background:color-mix(in srgb,var(--fc) 25%,var(--panel2));border-color:var(--fc);color:var(--fg);cursor:pointer}
.board{flex:1 1 0;min-height:0;display:grid;grid-template-columns:repeat(5,minmax(0,118px));justify-content:center;align-items:center;gap:clamp(4px,1.4vw,10px);padding:4px 0}
.slot{aspect-ratio:3/4;max-height:100%;border:1px dashed #223044;border-radius:6px;box-sizing:border-box}
.unit{--fc:var(--neutral);container-type:inline-size;aspect-ratio:3/4;max-height:100%;position:relative;border-radius:6px;overflow:hidden;box-sizing:border-box;cursor:pointer;
  background:var(--panel2);border:1.5px solid color-mix(in srgb,var(--fc) 55%,var(--line));transition:transform .15s}
.unit .u-art{position:absolute;inset:0 0 34% 0}
.unit .u-art svg{width:100%;height:100%;display:block}
.unit .u-name{position:absolute;left:0;right:0;bottom:22%;padding:0 5cqw;font-family:var(--display);font-weight:700;font-size:10cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit .u-kw{position:absolute;left:4cqw;top:4cqw;display:flex;gap:2cqw}
.unit .u-kw span{width:15cqw;height:15cqw;border-radius:50%;background:#0b1220cc;border:1px solid var(--fc);display:grid;place-items:center}
.unit .u-kw svg{width:10cqw;height:10cqw;fill:var(--fg)}
.unit .u-st{position:absolute;left:3cqw;right:3cqw;bottom:3cqw;display:flex;justify-content:space-between}
.unit .u-st .st{font-size:13cqw;height:18cqw;min-width:22cqw;border-radius:3cqw}
.unit .st.h.hurt{color:#fff;background:var(--hp)}
.unit .st.a.up,.unit .st.h.up{box-shadow:0 0 0 1px var(--ok)}
.unit.can{border-color:var(--ok);box-shadow:0 0 10px color-mix(in srgb,var(--ok) 45%,transparent)}
.unit.sel{transform:translateY(-6%) scale(1.04);border-color:#fff;box-shadow:0 0 18px #fff8}
.unit.tgt{border-color:var(--hp);box-shadow:0 0 14px var(--hp);animation:pulse 1s infinite}
.unit.ftgt{border-color:var(--ok);box-shadow:0 0 14px var(--ok);animation:pulse 1s infinite}
.unit.frozen::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,#9fe8ff55,#4fd2ff22);z-index:2;pointer-events:none;border:2px solid #bff1ff99;border-radius:5px}
.unit .barrier{position:absolute;inset:3px;border-radius:5px;box-shadow:inset 0 0 0 2px #b9e6ff,inset 0 0 14px #8fd8ff88;pointer-events:none;z-index:3}
.unit.fresh .u-art{opacity:.75}
@keyframes pulse{50%{filter:brightness(1.35)}}
.mid{display:flex;align-items:center;gap:8px;min-height:46px;flex-wrap:wrap}
.mid .info{flex:1 1 180px;min-width:0;font-size:14px;line-height:1.3;color:var(--dim)}
.mid .info b{color:var(--fg);font-family:var(--display)}
.hand{--hh:clamp(124px,22vh,210px);flex:none;height:var(--hh);box-sizing:border-box;display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px 2px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.hand .card{width:calc((var(--hh) - 24px)*5/7);flex:none;cursor:pointer;align-self:flex-start}
.hand .card:active{transform:translateY(-4px)}
.handback{display:flex;gap:3px;align-items:center}
.handback .cback{width:14px;border-radius:2px}
.handback .cback::after{content:none}
.float{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:700;font-size:22px;pointer-events:none;z-index:20;
  text-shadow:0 2px 6px #000;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
.float.dmg{color:#ff6b80}.float.heal{color:var(--ok)}.float.blk{color:#bfe9ff;font-size:15px}.float.buff{color:var(--ok);font-size:16px}.float.frz{color:var(--cryo);font-size:15px}
@keyframes floatup{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-140%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

.overlay{position:fixed;inset:0;z-index:50;background:#03060bd9;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.modal{display:flex;flex-direction:column;align-items:center;gap:14px;max-height:100%;overflow-y:auto;width:min(100%,420px)}
.modal .card{width:min(76vw,290px)}
.modal .status{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.kwhelp{font-size:13px;color:var(--dim);text-align:left;width:100%;display:flex;flex-direction:column;gap:4px}
.kwhelp b{color:var(--fg);font-family:var(--display)}
.banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:60;pointer-events:none;font-family:var(--display);font-weight:700;font-size:clamp(20px,5vw,34px);
  padding:10px 26px;background:#0b1220ee;border:1px solid var(--bc,var(--accent));color:var(--bc,var(--accent));letter-spacing:.06em;white-space:nowrap;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%);animation:ban 1.5s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-30%,-50%)}15%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0;transform:translate(-60%,-50%)}}
.pass{text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.pass h2{font-size:clamp(26px,6vw,40px)}
.result h2{font-size:clamp(34px,9vw,60px);letter-spacing:.05em}

/* ---------- DECK BUILDER ---------- */
.db{height:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-rows:auto auto 1fr;gap:10px;padding-block:10px;box-sizing:border-box}
.db-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.db-top input{flex:1 1 160px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fbtn{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;font-family:var(--display)}
.fbtn.on{background:var(--accent);color:#06101f;border-color:var(--accent)}
.db-body{display:grid;grid-template-columns:1fr 260px;gap:10px;min-height:0}
.pool{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;align-content:start;padding:2px;-webkit-overflow-scrolling:touch}
.ptile{position:relative;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.ptile .cnt{font-family:var(--display);font-size:12px;color:var(--dim);text-align:center}
.ptile .cnt b{color:var(--ok)}
.decklist{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.decklist .dh{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.decklist .dl{overflow-y:auto;flex:1;padding:4px 0}
.drow{display:flex;align-items:center;gap:8px;padding:5px 12px;cursor:pointer;font-size:14px}
.drow:hover{background:var(--panel2)}
.drow .dc{width:22px;height:22px;display:grid;place-items:center;background:var(--accent);color:#06101f;font-family:var(--display);font-weight:700;font-size:12px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);flex:none}
.drow .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--fc);padding-left:6px}
.drow .dx{font-family:var(--display);color:var(--dim)}
.curve{display:flex;align-items:flex-end;gap:3px;height:44px;padding:6px 12px;border-top:1px solid var(--line)}
.curve div{flex:1;background:var(--accent);opacity:.7;min-height:1px;border-radius:1px 1px 0 0;position:relative}
.curve span{position:absolute;bottom:-14px;left:0;right:0;text-align:center;font-size:9px;color:var(--dim);font-family:var(--display)}
@media (max-width:700px){
  .db-body{grid-template-columns:1fr;grid-template-rows:1fr 34%}
  .pool{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.dk{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px}
.dk .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:#1d2838}
.dk .bar i{display:block}

/* ---------- SHOP ---------- */
.packs{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.pack{width:150px;aspect-ratio:3/4;border-radius:8px;border:1px solid var(--accent);background:linear-gradient(160deg,#1b2a45,#0d1524);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;font-family:var(--display)}
.pack b{font-size:22px;letter-spacing:.06em}
.pack small{color:var(--dim)}
.reveal{display:grid;grid-template-columns:repeat(5,minmax(0,170px));gap:10px;justify-content:center;width:min(100%,900px)}
@media (max-width:640px){.reveal{grid-template-columns:repeat(3,minmax(0,1fr))}}
.flip{perspective:800px;cursor:pointer}
.flip .in{position:relative;transition:transform .6s;transform-style:preserve-3d;aspect-ratio:5/7}
.flip .in>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .in .front{transform:rotateY(180deg)}
.flip.open .in{transform:rotateY(180deg)}
.flip .tag{text-align:center;font-family:var(--display);font-size:12px;margin-top:4px;color:var(--dim);min-height:16px}
.flip .tag.new{color:var(--ok)}
.rules{display:flex;flex-direction:column;gap:14px;max-width:70ch}
.rules p,.rules li{line-height:1.65;color:#c8d4e2}
.rules h3{font-size:18px;color:var(--accent);margin-top:6px}
.tri{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--display)}
.tri span{padding:4px 10px;border-radius:4px;border:1px solid var(--fc);color:var(--fc)}
@media (max-width:600px){.handback,.pips,.mid .insp{display:none}.pbar{gap:8px;padding:6px 8px}.meta{gap:6px;font-size:13px}.board{grid-template-columns:repeat(5,minmax(0,1fr))}.mid .info{font-size:13px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
(()=>{
'use strict';
/* ================= DATA ================= */

const ARTC={};
function rng(seed){let h=2166136261;for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  return()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return((h>>>0)%10000)/10000;};}

   s+=`<polygon ${F} opacity=".55" points="${f(cx+tw/2)},${f(ty+2)} ${f(cx+tw/2+16+r()*6)},${f(ty-10)} ${f(cx+tw/2+8)},${f(ty+8)}"/>`;

 if(c.t==='trap')chips+=`<span class="chip">${c.trig==='attack'?'เมื่อถูกโจมตี':c.trig==='summon'?'เมื่อศัตรูลงยูนิต':'เมื่อศัตรูใช้แท็กติก'}</span>`;
 return `<div class="${cls.join(' ')}" style="--fc:${FAC[c.f].c}" ${o.attrs||''}>
  <div class="c-head"><div class="c-cost">${c.c}</div><div class="c-name">${esc(c.name)}</div></div>
  <div class="c-art">${art(id)}</div>
  <div class="c-type"><span>${TYPE[c.t]}<span class="fac"> · ${FAC[c.f].n}</span></span><span class="rar">${c.r}</span></div>
  <div class="c-kw">${chips}</div>
  <div class="c-text">${esc(c.txt||'')}</div>
  <div class="c-stats">${c.t==='unit'?`<span class="st a">${atk}</span><span class="st h">${hp}</span>`:''}</div>
 </div>`;
}

/* ================= GAME ENGINE ================= */
let G=null, UI={};
let uidc=1;
function mkUnit(id){const c=CARD[id];const kw={};(c.kw||[]).forEach(k=>kw[k]=true);
 return{uid:uidc++,id,atk:c.a,hp:c.h,maxHp:c.h,kw,canAttack:!!kw.rush,frozen:0,fresh:true};}
function newPlayer(name,deck,isAI){return{name,core:25,maxEn:0,en:0,deck:shuffle(deck),hand:[],board:[null,null,null,null,null],traps:[],fatigue:0,isAI};}
function log(t){G.log.unshift(t);if(G.log.length>60)G.log.pop();G.last=t;}
function fxf(key,text,cls){G.fx.push({key,text,cls});}
const ukey=u=>'u'+u.uid;
const unitAt=t=>t&&t.slot!=null?G.p[t.pi].board[t.slot]:null;
function enemyUnits(o){const r=[];G.p[o].board.forEach((u,s)=>{if(u&&u.hp>0)r.push({pi:o,slot:s});});return r;}
const uval=u=>u.atk*1.5+u.hp+CARD[u.id].c*.5;
function strongest(o){let b=null,bv=-1;for(const t of enemyUnits(o)){const v=uval(unitAt(t));if(v>bv){bv=v;b=t;}}return b;}

function draw(pi,n){const P=G.p[pi];
 for(let i=0;i<n;i++){
  if(!P.deck.length){P.fatigue++;P.core-=P.fatigue;fxf('c'+pi,'-'+P.fatigue,'dmg');log(`${P.name}: การ์ดหมดกอง เสียแกนกลาง ${P.fatigue}`);continue;}
  const id=P.deck.pop();
  if(P.hand.length>=8){log(`${P.name}: มือเต็ม ${CARD[id].name} ถูกทิ้ง`);continue;}
  P.hand.push({uid:uidc++,id});
 }}
function hitCore(o,n){if(n<=0)return;G.p[o].core-=n;fxf('c'+o,'-'+n,'dmg');G.shake='c'+o;}
function heal(pi,n){const P=G.p[pi];const b=P.core;P.core=Math.min(30,P.core+n);if(P.core>b)fxf('c'+pi,'+'+(P.core-b),'heal');}
function damageUnit(pi,slot,n){
 const u=G.p[pi].board[slot];if(!u||n<=0)return{dealt:0,excess:0};
 if(u.kw.barrier){u.kw.barrier=false;fxf(ukey(u),'บาเรียแตก','blk');return{dealt:0,excess:0,blocked:true};}
 const before=Math.max(0,u.hp);u.hp-=n;fxf(ukey(u),'-'+n,'dmg');
 return{dealt:Math.min(n,before),excess:Math.max(0,n-before)};
}
function hit(t,n){if(!t)return;if(t.core!=null)hitCore(t.core,n);else damageUnit(t.pi,t.slot,n);}
function freezeU(t){const u=unitAt(t);if(!u)return;u.frozen=(G.turn===t.pi)?2:1;u.canAttack=false;fxf(ukey(u),'แช่แข็ง','frz');}
const OPS={
 dmg:(x,n)=>hit(x.target,n),
 dmgCore:(x,n)=>hitCore(1-x.pi,n),
 healCore:(x,n)=>heal(x.pi,n),
 draw:(x,n)=>draw(x.pi,n),
 energy:(x,n)=>{G.p[x.pi].en+=n;},
 buff:(x,a,h)=>{const u=unitAt(x.target);if(u){u.atk+=a;u.hp+=h;u.maxHp+=h;fxf(ukey(u),`+${a}/+${h}`,'buff');}},
 barrier:x=>{const u=unitAt(x.target);if(u)u.kw.barrier=true;},
 rush:x=>{const u=unitAt(x.target);if(u&&!u.frozen)u.canAttack=true;},
 freeze:x=>freezeU(x.target),
 freezeStrongest:x=>{const t=strongest(1-x.pi);if(t)freezeU(t);},
 freezeRandom:x=>{const l=enemyUnits(1-x.pi);if(l.length)freezeU(pick(l));},
 freezeAll:x=>enemyUnits(1-x.pi).forEach(freezeU),
 dmgStrongest:(x,n)=>{const t=strongest(1-x.pi);if(t)hit(t,n);},
 aoe:(x,n)=>enemyUnits(1-x.pi).forEach(t=>hit(t,n)),
 aoeAll:(x,n)=>{enemyUnits(1-x.pi).forEach(t=>hit(t,n));hitCore(1-x.pi,n);},
 randomHits:(x,k,n)=>{const o=1-x.pi;for(let i=0;i<k;i++){const l=enemyUnits(o);l.push({core:o});hit(pick(l),n);}},
 summon:(x,id,k)=>{const B=G.p[x.pi].board;for(let i=0;i<k;i++){const s=B.indexOf(null);if(s<0)break;B[s]=mkUnit(id);}},
 shatter:x=>{const u=unitAt(x.target);if(!u)return;if(u.frozen){u.hp=0;fxf(ukey(u),'แตกกระจาย','dmg');}else hit(x.target,2);},
 dmgAttacker:(x,n)=>hit(x.attacker,n),
 freezeAttacker:x=>freezeU(x.attacker),
 bounceAttacker:x=>{const t=x.attacker,u=unitAt(t);if(!u)return;const Pl=G.p[t.pi];Pl.board[t.slot]=null;if(Pl.hand.length<8)Pl.hand.push({uid:uidc++,id:u.id});log(`${CARD[u.id].name} ถูกส่งกลับขึ้นมือ`);},
 dmgSummoned:(x,n)=>hit(x.summoned,n),
 cancel:x=>{x.cancel=true;},
};
function runFx(list,ctx){for(const [op,...a] of list||[])OPS[op](ctx,...a);return ctx;}
function springTrap(owner,trig,ctx){
 const Pl=G.p[owner];const i=Pl.traps.findIndex(h=>CARD[h.id].trig===trig);if(i<0)return null;
 const h=Pl.traps.splice(i,1)[0];const c=CARD[h.id];
 log(`กับดัก! ${Pl.name} เปิด ${c.name}`);banner('กับดัก · '+c.name,FAC[c.f].c);
 return runFx(c.fx,{...ctx,pi:owner});
}
function cleanup(){
 let again=true,guard=0;
 while(again&&guard++<20){again=false;
  for(const pi of[0,1])G.p[pi].board.forEach((u,s)=>{
   if(u&&u.hp<=0){G.p[pi].board[s]=null;const c=CARD[u.id];log(`${c.name} ถูกทำลาย`);if(c.die){runFx(c.die,{pi});again=true;}}
  });}
}
function checkWin(){
 if(G.over)return;const a=G.p[0].core<=0,b=G.p[1].core<=0;
 if(a||b){G.over=true;G.winner=a&&b?G.turn:(a?1:0);}
}
function targetsFor(pi,tgt){const o=1-pi,r=[];
 if(tgt==='enemyUnit'||tgt==='enemyAny')r.push(...enemyUnits(o));
 if(tgt==='enemyAny')r.push({core:o});
 if(tgt==='friendlyUnit')r.push(...enemyUnits(pi));
 return r;}
function playIssue(pi,h){const Pl=G.p[pi],c=CARD[h.id];
 if(c.c>Pl.en)return'พลังงานไม่พอ';
 if(c.t==='unit'&&Pl.board.indexOf(null)<0)return'สนามเต็ม (สูงสุด 5 ยูนิต)';
 if(c.t==='trap'&&Pl.traps.length>=2)return'วางกับดักได้สูงสุด 2 ใบ';
 if(c.t==='tactic'&&c.tgt&&!targetsFor(pi,c.tgt).length)return'ไม่มีเป้าหมาย';
 return'';}
function play(pi,uid,target){
 const Pl=G.p[pi],i=Pl.hand.findIndex(h=>h.uid===uid);if(i<0)return false;
 const h=Pl.hand[i],c=CARD[h.id];if(playIssue(pi,h))return false;
 Pl.en-=c.c;Pl.hand.splice(i,1);
 if(c.t==='trap'){Pl.traps.push(h);log(`${Pl.name} วางกับดักคว่ำไว้`);return true;}
 if(c.t==='unit'){
  const s=Pl.board.indexOf(null);const u=mkUnit(h.id);Pl.board[s]=u;log(`${Pl.name} ลงสนาม ${c.name}`);
  springTrap(1-pi,'summon',{summoned:{pi,slot:s}});cleanup();
  if(Pl.board[s]===u&&c.dep)runFx(c.dep,{pi,src:{pi,slot:s}});
  cleanup();checkWin();return true;
 }
 log(`${Pl.name} ใช้ ${c.name}`);banner(c.name,FAC[c.f].c);
 const tc=springTrap(1-pi,'tactic',{});
 if(tc&&tc.cancel){log(`${c.name} ถูกยกเลิก`);cleanup();checkWin();return true;}
 if(c.tgt&&target&&target.slot!=null&&!unitAt(target)){cleanup();return true;}
 runFx(c.fx,{pi,target});cleanup();checkWin();return true;
}
function attackTargets(pi){const o=1-pi,O=G.p[o];
 const guards=enemyUnits(o).filter(t=>unitAt(t).kw.guard);
 if(guards.length)return guards;
 return[...enemyUnits(o),{core:o}];}
const sameT=(a,b)=>a.core!=null?b.core===a.core:(b.pi===a.pi&&b.slot===a.slot);
function adv(A,D){return CARD[A.id].f&&BEATS[CARD[A.id].f]===CARD[D.id].f?1:0;}
function attack(pi,slot,tgt){
 const Pl=G.p[pi],o=1-pi,O=G.p[o],A=Pl.board[slot];if(!A||!A.canAttack)return false;
 if(!attackTargets(pi).some(t=>sameT(t,tgt)))return false;
 A.canAttack=false;A.fresh=false;
 const tc=springTrap(o,'attack',{attacker:{pi,slot}});cleanup();
 if(Pl.board[slot]!==A||A.hp<=0||(tc&&tc.cancel)){checkWin();return true;}
 const an=CARD[A.id].name;
 if(tgt.core!=null){hitCore(o,A.atk);if(A.kw.drain)heal(pi,A.atk);log(`${an} โจมตีแกนกลาง ${A.atk}`);}
 else{const D=O.board[tgt.slot];if(!D){return true;}
  const ad=A.atk>0?A.atk+adv(A,D):0,dd=D.atk>0?D.atk+adv(D,A):0;
  log(`${an} โจมตี ${CARD[D.id].name}`);
  const r=damageUnit(o,tgt.slot,ad);if(A.kw.pierce&&r.excess>0)hitCore(o,r.excess);if(A.kw.drain&&r.dealt>0)heal(pi,r.dealt);
  if(dd>0){const r2=damageUnit(pi,slot,dd);if(D.kw.drain&&r2.dealt>0)heal(o,r2.dealt);}
 }
 cleanup();checkWin();return true;
}
function startTurn(pi){const Pl=G.p[pi];
 Pl.maxEn=Math.min(10,Pl.maxEn+1);Pl.en=Pl.maxEn;draw(pi,1);
 Pl.board.forEach(u=>{if(u){u.canAttack=!u.frozen;u.fresh=false;}});
 Pl.board.forEach((u,s)=>{const c=u&&CARD[u.id];if(c&&c.ts)runFx(c.ts,{pi,src:{pi,slot:s}});});
 cleanup();checkWin();}
function endTurn(){
 if(!G||G.over)return;const Pl=G.p[G.turn];
 Pl.board.forEach(u=>{if(u&&u.frozen>0)u.frozen--;});
 G.turn=1-G.turn;G.turnNo++;UI={};startTurn(G.turn);
 if(G.mode==='pvp'&&!G.over)G.pass=true;
 renderGame();
 if(!G.over&&G.p[G.turn].isAI)aiTurn();
}
function startMatch(cfg){
 uidc=1;
 const p0=newPlayer(cfg.n0,cfg.d0,!!cfg.ai0),p1=newPlayer(cfg.n1,cfg.d1,!!cfg.ai1);
 G={mode:cfg.mode,diff:cfg.diff||'normal',p:[p0,p1],turn:rnd(2),turnNo:1,over:false,log:[],fx:[],pass:cfg.mode==='pvp'};
 draw(0,4);draw(1,4);draw(1-G.turn,1);
 log(`${G.p[G.turn].name} เริ่มก่อน`);
 UI={};screen='game';startTurn(G.turn);renderGame();
 banner(G.p[G.turn].name+' เริ่มก่อน','var(--accent)');
 if(G.p[G.turn].isAI)aiTurn();
}

/* ================= AI ================= */
function aiTactic(pi,c){
 const Pl=G.p[pi],o=1-pi,O=G.p[o];const ops=Object.fromEntries((c.fx||[]).map(x=>[x[0],x]));
 if(ops.dmg){const n=ops.dmg[1];let best=null,bv=-1;
  if(c.tgt==='enemyAny'&&O.core<=n)return[100,{core:o}];
  for(const t of enemyUnits(o)){const u=unitAt(t);if(!u.kw.barrier&&u.hp<=n){const v=uval(u);if(v>bv){bv=v;best=t;}}}
  if(best)return[bv+1,best];
  if(c.tgt==='enemyAny')return[1.2,{core:o}];
  const s=strongest(o);return s?[.5,s]:[-1,null];}
 if(ops.shatter){let best=null,bv=-1;for(const t of enemyUnits(o)){const u=unitAt(t);const v=u.frozen?uval(u)+3:(u.hp<=2&&!u.kw.barrier?uval(u):-1);if(v>bv){bv=v;best=t;}}return[bv,best];}
 if(ops.freeze){const s=strongest(o);if(!s)return[-1,null];const u=unitAt(s);return[u.atk>=3&&!u.frozen?u.atk+1:.4,s];}
 if(c.tgt==='friendlyUnit'){let best=null,bv=-1;for(const t of enemyUnits(pi)){const u=unitAt(t);let v=u.atk+u.hp*.3;if(ops.rush&&!u.canAttack&&!u.frozen)v+=3;if(ops.barrier&&u.kw.barrier)v-=4;if(v>bv){bv=v;best=t;}}return best?[2.5+bv*.2,best]:[-1,null];}
 if(ops.aoe){const n=ops.aoe[1];const l=enemyUnits(o);let s=0;for(const t of l){const u=unitAt(t);s+=(!u.kw.barrier&&u.hp<=n)?uval(u):.8;}return[l.length>=2||s>6?s:-1,null];}
 if(ops.randomHits)return[enemyUnits(o).length+2,null];
 if(ops.summon)return[Pl.board.filter(x=>!x).length>=2?3:-1,null];
 if(ops.healCore)return[Pl.core<=15?6:.6,null];
 if(ops.energy){const can=Pl.hand.some(h=>CARD[h.id]!==c&&CARD[h.id].c>Pl.en-c.c&&CARD[h.id].c<=Pl.en-c.c+ops.energy[1]);return[can?5:-1,null];}
 if(ops.draw)return[Pl.hand.length<=3?4:1.5,null];
 return[1,null];
}
function aiBestPlay(pi){const Pl=G.p[pi];let best=null;
 for(const h of Pl.hand){if(playIssue(pi,h))continue;const c=CARD[h.id];let s=-1,target=null;
  if(c.t==='unit'){s=c.c*2+(c.a+c.h)*.5+1;if(c.dep)s+=1.5;}
  else if(c.t==='trap')s=c.c+1.5;
  else[s,target]=aiTactic(pi,c);
  if(G.diff==='easy')s+=Math.random()*4-1.5;
  if(s>0&&(!best||s>best.s))best={s,uid:h.uid,target};}
 return best;}
function aiBestAttack(pi){const Pl=G.p[pi],o=1-pi,O=G.p[o];
 const att=Pl.board.map((u,s)=>u&&u.canAttack&&u.atk>0?s:-1).filter(s=>s>=0);if(!att.length)return null;
 att.sort((a,b)=>Pl.board[b].atk-Pl.board[a].atk);
 const s=att[0],A=Pl.board[s];const tg=attackTargets(pi);const guards=tg.every(t=>t.core==null);
 const total=att.reduce((a,i)=>a+Pl.board[i].atk,0);
 if(!guards&&(total>=O.core||(G.diff==='easy'&&Math.random()<.6)))return{slot:s,tgt:{core:o}};
 let best=null;
 for(const t of tg){if(t.core!=null)continue;const D=unitAt(t);
  const ad=A.atk+adv(A,D),dd=D.atk>0?D.atk+adv(D,A):0;
  const kills=!D.kw.barrier&&ad>=D.hp,dies=!A.kw.barrier&&dd>=A.hp;
  let sc=(kills?uval(D):0)-(dies?uval(A):0)+(kills&&!dies?3:0);
  if(!best||sc>best.sc)best={sc,t};}
 if(guards)return{slot:s,tgt:best.t};
 if(best&&best.sc>=2&&G.diff!=='easy')return{slot:s,tgt:best.t};
 return{slot:s,tgt:{core:o}};}
async function aiTurn(){
 const g=G;G.busy=true;renderGame();await sleep(800);
 const pi=G.turn;
 for(let k=0;k<15&&G===g&&!G.over;k++){const mv=aiBestPlay(pi);if(!mv)break;play(pi,mv.uid,mv.target);renderGame();await sleep(850);}
 for(let k=0;k<10&&G===g&&!G.over;k++){const at=aiBestAttack(pi);if(!at)break;attack(pi,at.slot,at.tgt);renderGame();await sleep(700);}
 if(G!==g)return;G.busy=false;
 if(!G.over)endTurn();else renderGame();
}

function midHTML(){const v=viewer();let info='',btns='';
 if(G.over){info='<b>จบเกม</b>';}
 else if(!myTurn()){info=G.busy?`<b>${esc(G.p[G.turn].name)}</b> กำลังคิด… · ${esc(G.last||'')}`:esc(G.last||'');}
 else if(UI.mode==='attack'){const u=G.p[v].board[UI.slot];info=`<b>${esc(CARD[u.id].name)}</b> เลือกเป้าหมายที่จะโจมตี${attackTargets(v).some(t=>t.core==null)&&attackTargets(v).every(t=>t.core==null)?' (ต้องตีตัวคุ้มกันก่อน)':''}`;

/* ================= GAME INPUT ================= */
function onGame(act,el){
 const v=viewer();
 if(act==='ready'){G.pass=false;renderGame();return;}
 if(act==='closemodal'){UI.modal=null;renderGame();return;}
 if(act==='gmenu'){UI.modal=`<div class="overlay" data-act="closemodal"><div class="modal panel" data-stop="1"><h3>เมนูเกม</h3>
   <div class="kwhelp" style="max-height:40vh;overflow:auto">${G.log.slice(0,25).map(l=>`<div>${esc(l)}</div>`).join('')}</div>
   <div class="row" style="justify-content:center"><button class="btn warn" data-act="surrender">${UI.sure?'แตะอีกครั้งเพื่อยืนยันยอมแพ้':'ยอมแพ้'}</button><button class="btn" data-act="closemodal">กลับไปเล่น</button></div></div></div>`;renderGame();return;}
 if(act==='surrender'){if(!UI.sure){UI.sure=true;onGame('gmenu');return;}
  UI={};const loser=G.mode==='ai'?0:G.turn;G.p[loser].core=0;G.over=true;G.winner=1-loser;G.busy=false;renderGame();return;}
 if(act==='rematch'){const c=G.cfg;startMatch(c);G.cfg=c;return;}
 if(act==='menu'){G=null;go('menu');return;}
 if(act==='trap'){const h=G.p[v].traps.find(x=>x.uid==el.dataset.uid);if(h){UI.modal=detailModal(h.id);renderGame();}return;}
 if(act==='inspect'){const u=G.p[+el.dataset.pi].board[+el.dataset.slot];if(u){UI.modal=detailModal(u.id,{unit:u});renderGame();}return;}
 if(act==='cancel'){UI={};renderGame();return;}
 if(act==='end'){if(myTurn())endTurn();return;}
 if(act==='hand'){
  const h=G.p[v].hand.find(x=>x.uid==el.dataset.uid);if(!h)return;
  if(!myTurn()){UI.modal=detailModal(h.id);renderGame();return;}
  const iss=playIssue(v,h);const c=CARD[h.id];
  const lab=c.t==='unit'?'ลงสนาม':c.t==='trap'?'วางกับดัก':'ใช้แท็กติก';
  UI={modal:detailModal(h.id,{actions:`<button class="btn pri" data-act="use" data-uid="${h.uid}" ${iss?'disabled':''}>${iss||lab+' · '+c.c+' พลังงาน'}</button>`})};
  renderGame();return;}
 if(act==='use'){const h=G.p[v].hand.find(x=>x.uid==el.dataset.uid);if(!h||!myTurn())return;const c=CARD[h.id];
  if(c.t==='tactic'&&c.tgt){UI={mode:'target',uid:h.uid};renderGame();return;}
  UI={};play(v,h.uid,null);renderGame();return;}
 if(act==='unit'||act==='core'){
  const pi=+el.dataset.pi,slot=act==='unit'?+el.dataset.slot:null;
  const t=act==='core'?{core:pi}:{pi,slot};
  const valid=curTargets().some(x=>sameT(x,t));
  if(valid&&UI.mode==='target'){const uid=UI.uid;UI={};play(v,uid,t);renderGame();return;}
  if(valid&&UI.mode==='attack'){const s=UI.slot;UI={};attack(v,s,t);renderGame();return;}
  if(act==='core')return;
  const u=G.p[pi].board[slot];if(!u)return;
  if(pi===v&&myTurn()&&!UI.mode&&u.canAttack){UI={mode:'attack',slot};renderGame();return;}
  if(pi===v&&UI.mode==='attack'&&UI.slot===slot){UI={modal:detailModal(u.id,{unit:u})};renderGame();return;}
  UI.modal=detailModal(u.id,{unit:u});renderGame();return;}
}

  <ol><li>พลังงานสูงสุดเพิ่ม 1 (สูงสุด 10) และเติมเต็ม</li><li>จั่วการ์ด 1 ใบ ถ้ากองหมดจะเสียแกนกลางเพิ่มขึ้นทุกครั้ง</li><li>ใช้การ์ดได้ตามพลังงานที่มี และสั่งยูนิตโจมตีได้ตัวละ 1 ครั้ง</li><li>กด <b>จบเทิร์น</b></li></ol>
  <h3>ชนิดการ์ด</h3>

  <li><b>แท็กติก</b> ใช้แล้วเกิดผลทันที บางใบต้องเลือกเป้าหมาย</li>
  <li><b>กับดัก</b> วางคว่ำไว้ได้ 2 ใบ ทำงานเองเมื่อศัตรูทำตามเงื่อนไข (โจมตี / ลงยูนิต / ใช้แท็กติก) ศัตรูไม่เห็นว่าเป็นใบอะไร</li></ul>
  <h3>การต่อสู้</h3>
  <p>ยูนิตที่ปะทะกันจะทำดาเมจใส่กันพร้อมกัน ถ้าศัตรูมียูนิต <b>คุ้มกัน</b> ต้องตีตัวนั้นก่อน ถึงจะตียูนิตอื่นหรือแกนกลางได้</p>
  <h3>ธาตุ</h3>

  <h3>คีย์เวิร์ด</h3>
  <ul>${Object.values(KW).map(k=>`<li><b>${k[0]}</b> — ${k[1]}</li>`).join('')}<li><b>แช่แข็ง</b> — ยูนิตโจมตีไม่ได้ในเทิร์นถัดไปของเจ้าของ</li></ul>
  <h3>เครดิตและซอง</h3>

app.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act;
 if(act==='closemodal'&&e.target.closest('[data-stop]')&&!e.target.closest('button[data-act="closemodal"]'))return;
 if(screen==='game'&&G){onGame(act,el);return;}
 switch(act){
  case'nav':go(el.dataset.to);break;
  case'setup':setupMode=el.dataset.mode;go('setup');break;
  case'start':startFromSetup();break;
  case'newdeck':DB={name:'เดคใหม่ '+(save.decks.length+1),cards:[],idx:-1,ff:'all',ft:'all'};go('builder');break;
  case'editdeck':{const i=+el.dataset.i;DB={name:save.decks[i].name,cards:save.decks[i].cards.slice(),idx:i,ff:'all',ft:'all'};go('builder');break;}
  case'copydeck':{const s=STARTERS[+el.dataset.i];DB={name:s.name+' (แก้)',cards:s.cards.slice(),idx:-1,ff:'all',ft:'all'};go('builder');break;}
  case'filter':DB[el.dataset.k]=el.dataset.v;DB.name=document.getElementById('dname').value;renderBuilder();break;
  case'addcard':{const id=el.dataset.id;const n=DB.cards.filter(x=>x===id).length;DB.name=document.getElementById('dname').value;
   if((save.coll[id]||0)>n&&n<maxCopies(id)&&DB.cards.length<30){DB.cards.push(id);renderBuilder();}else{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}break;}
  case'rmcard':{const i=DB.cards.lastIndexOf(el.dataset.id);DB.name=document.getElementById('dname').value;if(i>=0)DB.cards.splice(i,1);renderBuilder();break;}
  case'savedeck':{DB.name=document.getElementById('dname').value.trim()||'เดคไม่มีชื่อ';const d={name:DB.name,cards:DB.cards.slice()};
   if(DB.idx>=0)save.decks[DB.idx]=d;else{save.decks.push(d);DB.idx=save.decks.length-1;}persist();go('decks');break;}
  case'deldeck':if(!DB.sure){DB.sure=true;DB.name=document.getElementById('dname').value;renderBuilder();}else{save.decks.splice(DB.idx,1);persist();go('decks');}break;
  case'buy':openPack();break;
  case'flip':el.classList.add('open');break;
  case'flipall':app.querySelectorAll('.flip').forEach((f,i)=>setTimeout(()=>f.classList.add('open'),i*150));break;
 }
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click();}});
