<script>
window.ready = (async () => { await document.fonts.load('800 50px Kanit', 'ก'); await document.fonts.load('500 34px Kanit', 'ก'); await document.fonts.load('800 50px Kanit', 'A1'); await document.fonts.load('500 34px Kanit', 'A1'); initPlayer(); return true; })();
// preview: ?t=seconds  (space = play/pause)
window.addEventListener('load', async () => { await window.ready; const q = new URLSearchParams(location.search); if (q.has('auto')) return; let t = +(q.get('t') || 0), play = false, last = 0;
  draw(t); addEventListener('keydown', e => { if (e.code === 'Space') play = !play; });
  const loop = ts => { if (play) { t += Math.min(0.1, (ts - last) / 1000); draw(t); } last = ts; requestAnimationFrame(loop); }; requestAnimationFrame(loop); });
</script></body></html>
