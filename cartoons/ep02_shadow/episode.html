<!doctype html>
<html><head><meta charset="utf-8">
<title>เงาที่ตามมา</title>
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block;height:100vh;margin:0 auto}</style>
</head><body><canvas id="cv" width="720" height="1280"></canvas>
<script>
/* "เงาที่ตามมา" (The Shadow That Follows), episode 2 of the Red Forest cartoon.
   A cartoon drawn entirely by code: every frame is draw(t) on a 2D canvas. No generated images, no AI voice.
   Open this file to watch it (press space to play/pause), or render it with render.js. */
const W=720,H=1280,FPS=24,DUR=46;
const cv=document.getElementById("cv"),c=cv.getContext("2d");
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t);},easeOut=t=>1-Math.pow(1-clamp(t),3),easeIn=t=>Math.pow(clamp(t),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const INK="#120304",RIM="rgba(255,112,72,.6)",WARM="255,196,120";

/* ---------- camera ---------- */
function setCam(cam,par=1){c.setTransform(cam.z,0,0,cam.z,W/2-cam.x*par*cam.z,cam.gy);}
function scr(cam,wx,wy,par=1){return [W/2+(wx-cam.x*par)*cam.z,cam.gy+wy*cam.z];}
function reset(){c.setTransform(1,0,0,1,0,0);}

/* ---------- world ---------- */
function sky(t,cam,mood){ reset(); const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#3a0708"); g.addColorStop(0.45,"#8f1611"); g.addColorStop(0.72,"#c9321c"); g.addColorStop(1,"#5a0c0b"); c.fillStyle=g; c.fillRect(0,0,W,H);
  const mx=W*0.68-cam.x*0.02,my=H*0.2+(cam.gy-930)*0.15; let h=c.createRadialGradient(mx,my,10,mx,my,420); h.addColorStop(0,"rgba(255,120,80,.55)"); h.addColorStop(1,"rgba(255,90,60,0)"); c.fillStyle=h; c.fillRect(0,0,W,H);
  c.fillStyle="#ff8a5c"; c.beginPath(); c.arc(mx,my,74,0,7); c.fill(); c.fillStyle="rgba(190,50,30,.35)"; c.beginPath(); c.arc(mx-22,my-14,16,0,7); c.arc(mx+26,my+20,11,0,7); c.arc(mx+8,my-34,7,0,7); c.fill();
  c.lineWidth=3; for(let k=0;k<3;k++){ c.strokeStyle=`rgba(255,130,90,${0.32-k*0.09})`; c.beginPath(); c.arc(mx,my,118+k*52+Math.sin(t*0.8+k)*4,Math.PI*0.95,Math.PI*2.05); c.stroke(); } }
function trees(cam,par,seed,spacing,col,wMin,wMax,branch){ setCam(cam,par); const half=W/2/cam.z+300, x0=cam.x*par-half, x1=cam.x*par+half; c.fillStyle=col; c.strokeStyle=col; c.lineCap="round";
  for(let i=Math.floor(x0/spacing)-1;i<=Math.ceil(x1/spacing)+1;i++){ const x=i*spacing+(rnd(i*7+seed)-0.5)*spacing*0.7, w=wMin+rnd(i*3+seed)*(wMax-wMin), lean=(rnd(i*5+seed)-0.5)*90;
    c.beginPath(); c.moveTo(x-w*0.62,30); c.lineTo(x-w*0.4,-300); c.lineTo(x+lean-w*0.28,-2200); c.lineTo(x+lean+w*0.28,-2200); c.lineTo(x+w*0.4,-300); c.lineTo(x+w*0.62,30); c.closePath(); c.fill();
    if(branch){ for(let b=0;b<2;b++){ const by=-360-rnd(i*11+b+seed)*520, dir=rnd(i*13+b+seed)>0.5?1:-1, len=90+rnd(i*17+b)*120; c.lineWidth=w*0.16; c.beginPath(); c.moveTo(x+lean*(-by/2200),by); c.quadraticCurveTo(x+dir*len*0.5,by-30,x+dir*len,by-90-rnd(i+b)*60); c.stroke(); } } } }
function ground(cam){ setCam(cam,1); const half=W/2/cam.z+60; c.fillStyle=INK; c.beginPath(); c.moveTo(cam.x-half,3000); for(let x=cam.x-half;x<=cam.x+half+20;x+=20){ c.lineTo(x,Math.sin(x*0.013)*6+Math.sin(x*0.05)*2); } c.lineTo(cam.x+half,3000); c.closePath(); c.fill();
  c.strokeStyle="rgba(255,110,70,.28)"; c.lineWidth=2/cam.z; c.beginPath(); for(let x=cam.x-half;x<=cam.x+half+20;x+=20){ c.lineTo(x,Math.sin(x*0.013)*6+Math.sin(x*0.05)*2); } c.stroke(); }
function grass(cam,par,seed,spacing,size,col,t){ setCam(cam,par); const half=W/2/cam.z+200, x0=cam.x*par-half, x1=cam.x*par+half; c.fillStyle=col;
  for(let i=Math.floor(x0/spacing)-1;i<=Math.ceil(x1/spacing)+1;i++){ const x=i*spacing+(rnd(i*9+seed)-0.5)*spacing, n=5+Math.floor(rnd(i+seed)*4), s=size*(0.6+rnd(i*2+seed)*0.8);
    for(let k=0;k<n;k++){ const a=(k/(n-1)-0.5)*1.5+Math.sin(t*1.4+i+k)*0.06, L=s*(0.6+rnd(i*31+k)*0.6); c.beginPath(); c.moveTo(x-s*0.07,8); c.quadraticCurveTo(x+Math.sin(a)*L*0.5,-L*0.6,x+Math.sin(a)*L,-Math.cos(a)*L); c.quadraticCurveTo(x+Math.sin(a)*L*0.4,-L*0.45,x+s*0.07,8); c.fill(); } } }
function fog(t,cam,a){ reset(); for(let k=0;k<3;k++){ const y=cam.gy-150+k*70, off=((t*14*(k+1)+k*200-cam.x*0.3)%900+900)%900-450; const g=c.createLinearGradient(0,y-60,0,y+60); g.addColorStop(0,"rgba(255,90,60,0)"); g.addColorStop(0.5,`rgba(255,90,60,${a*(0.12-k*0.025)})`); g.addColorStop(1,"rgba(255,90,60,0)"); c.fillStyle=g; c.fillRect(off-200,y-60,W+400,120); } }
function world(t,cam,o={}){ sky(t,cam); trees(cam,0.22,11,210,"#7c1512",26,60,false); trees(cam,0.45,23,300,"#4b0a0b",44,96,true); fog(t,cam,1);
  trees(cam,0.8,37,420,"#240506",70,150,true); grass(cam,0.9,5,160,70,"#240506",t); if(o.back) o.back(); ground(cam); grass(cam,1,8,120,46,INK,t); }
function foreground(t,cam){ grass(cam,1.5,91,560,200,"#060102",t); reset(); }

/* ---------- lighting ---------- */
const dk=document.createElement("canvas"); dk.width=W; dk.height=H; const dc=dk.getContext("2d");
function darkness(alpha,lights){ lights=[...lights,{x:W*0.66,y:H*0.2,r:560,k:0.5}]; alpha*=0.84; dc.globalCompositeOperation="source-over"; dc.clearRect(0,0,W,H); dc.fillStyle=`rgba(6,1,2,${alpha})`; dc.fillRect(0,0,W,H); dc.globalCompositeOperation="destination-out";
  for(const L of lights){ if(L.k<=0||L.r<=0) continue; const g=dc.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r); g.addColorStop(0,`rgba(0,0,0,${L.k})`); g.addColorStop(0.5,`rgba(0,0,0,${L.k*0.55})`); g.addColorStop(1,"rgba(0,0,0,0)"); dc.fillStyle=g; dc.fillRect(L.x-L.r,L.y-L.r,L.r*2,L.r*2); }
  reset(); c.drawImage(dk,0,0); c.globalCompositeOperation="lighter"; for(const L of lights){ if(!L.warm||L.k<=0) continue; const r=L.r*0.8,g=c.createRadialGradient(L.x,L.y,0,L.x,L.y,r); g.addColorStop(0,`rgba(${WARM},${0.42*L.k})`); g.addColorStop(1,`rgba(${WARM},0)`); c.fillStyle=g; c.fillRect(L.x-r,L.y-r,r*2,r*2); } c.globalCompositeOperation="source-over"; }
function glowDot(x,y,r,a,col=WARM){ c.globalCompositeOperation="lighter"; const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(0.3,`rgba(${col},${a*0.45})`); g.addColorStop(1,`rgba(${col},0)`); c.fillStyle=g; c.fillRect(x-r,y-r,r*2,r*2); c.globalCompositeOperation="source-over"; }

/* ---------- the pup (a small fox) ---------- */
function pup(cam,x,y,s,o={}){ setCam(cam,1); c.translate(x,y); if(o.xf) c.transform(...o.xf); const rim=o.shadow?"rgba(0,0,0,0)":RIM; if(o.rot) { c.translate(0,-28*s); c.rotate(o.rot); c.translate(0,28*s); } c.scale(s*(o.flip?-1:1),s);
  const ph=o.phase||0, run=o.run||0, walk=o.walk||0, amp=o.sit?0:run?15:walk?8:0, bob=run?Math.abs(Math.sin(ph))*-5:walk?Math.abs(Math.sin(ph))*-2:0, cr=o.crouch||0, sh=(o.shake||0)*Math.sin((o.t||0)*46)*1.4;
  c.translate(sh,bob+cr*9); const sitting=(o.sit||0)>0.5; c.fillStyle=INK; c.strokeStyle=INK; c.lineCap="round"; c.lineJoin="round";
  if(sitting){ // sitting: tail curled on the ground, round haunch, upright chest, straight front legs
    const tw2=o.wag?Math.sin((o.t||0)*10)*0.25:0; c.save(); c.translate(-20,-6); c.rotate(tw2); c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-20,-6,-48,-2,-56,10); c.bezierCurveTo(-38,14,-14,10,4,6); c.closePath(); c.fill(); c.strokeStyle=rim; c.lineWidth=1.5; c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-20,-6,-48,-2,-56,10); c.stroke(); c.restore();
    c.beginPath(); c.ellipse(-8,-20,21,20,0,0,7); c.fill(); c.beginPath(); c.ellipse(6,-44,15,27,-0.22,0,7); c.fill(); c.strokeStyle=rim; c.lineWidth=1.6; c.beginPath(); c.ellipse(-8,-20,21,20,0,Math.PI*1.0,Math.PI*1.6); c.stroke();
    c.strokeStyle=INK; c.lineWidth=6.5; c.beginPath(); c.moveTo(12,-32); c.lineTo(15,-1); c.moveTo(3,-30); c.lineTo(6,-1); c.stroke(); }
  else {
  const tw=Math.sin((o.t||0)*(o.wag?16:2.2))*(o.wag?0.5:0.12)-(run?0.5:0)+(cr?0.5:0);
  c.save(); c.translate(-24,-30); c.rotate(-0.9+tw); c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-16,-10,-30,-36,-12,-58); c.bezierCurveTo(4,-44,14,-20,6,0); c.closePath(); c.fill(); c.strokeStyle=rim; c.lineWidth=1.6; c.stroke(); c.restore();
  const leg=(hx,p,front)=>{ const fx=hx+Math.sin(p)*amp*(run?1.5:1), fy=-Math.max(0,Math.cos(p))*amp*0.55-cr*-2, kx=(hx+fx)/2+(front?4:-5), ky=-9; c.strokeStyle=INK; c.lineWidth=6.5; c.beginPath(); c.moveTo(hx,-18+cr*6); c.quadraticCurveTo(kx,ky,fx,Math.min(0,fy)-cr*9); c.stroke(); };
  leg(-17,ph+Math.PI,false); leg(15,ph+Math.PI*0.9,true);
  c.fillStyle=INK; c.beginPath(); c.ellipse(0,-27,27,15.5,-0.06,0,7); c.fill(); c.strokeStyle=rim; c.lineWidth=1.6; c.beginPath(); c.ellipse(0,-27,27,15.5,-0.06,Math.PI*1.05,Math.PI*1.95); c.stroke();
  leg(-12,ph,false); leg(19,ph+0.2,true);
  }
  // head
  const look=o.look||0, hx=sitting?16:25+look*2, hy=sitting?-78:-46+(o.duck||0)*9+cr*3; c.save(); c.translate(hx,hy); c.rotate((o.headTilt||0)+look*0.12);
  const ed=o.earDroop||0; c.fillStyle=INK; for(const sx of [-1,1]){ c.save(); c.translate(sx*7-1,-9); c.rotate(sx*(0.25+ed*1.1)); c.beginPath(); c.moveTo(-6,2); c.lineTo(0,-19+ed*4); c.lineTo(6,2); c.closePath(); c.fill(); c.strokeStyle=rim; c.lineWidth=1.4; c.beginPath(); c.moveTo(-6,2); c.lineTo(0,-19+ed*4); c.stroke(); c.restore(); }
  c.fillStyle=INK; c.beginPath(); c.arc(0,0,14,0,7); c.fill(); c.beginPath(); c.moveTo(6,-6); c.quadraticCurveTo(22,-2,23,4); c.quadraticCurveTo(14,10,4,10); c.closePath(); c.fill();
  c.strokeStyle=rim; c.lineWidth=1.5; c.beginPath(); c.arc(0,0,14,Math.PI*1.05,Math.PI*1.9); c.stroke();
  if(o.mouth&&!o.shadow){ c.fillStyle="#7a1410"; c.beginPath(); c.ellipse(15,8,5,2+o.mouth*3,0.2,0,7); c.fill(); }
  if(!(o.cover>0.5)&&!o.shadow){ const ew=o.eyeWide||0; c.fillStyle="#ffe2c8"; c.beginPath(); c.arc(5,-2,2.6+ew*2.2,0,7); c.fill(); if(ew>0.3){ c.fillStyle=INK; c.beginPath(); c.arc(5.6+look,-2,1.3,0,7); c.fill(); } }
  if(o.cover>0){ c.strokeStyle=INK; c.lineWidth=7; c.beginPath(); c.moveTo(-6,18); c.quadraticCurveTo(2,10,7*o.cover,-2*o.cover); c.stroke(); c.strokeStyle=rim; c.lineWidth=1.3; c.stroke(); }
  if(o.sweat){ c.fillStyle="rgba(255,190,160,.9)"; for(let k=0;k<2;k++){ const u=((o.t*2.2+k*0.5)%1); c.beginPath(); c.ellipse(-10-u*14,-10-u*10+k*8,2,3.4,0.6,0,7); c.fill(); } }
  c.restore();
  // lantern held in the mouth
  if(o.lantern!==undefined){ const lx=hx+19, ly=hy+8+Math.sin(ph*2)*1.5; c.strokeStyle=INK; c.lineWidth=1.6; c.beginPath(); c.moveTo(lx,ly); c.lineTo(lx+2,ly+9); c.stroke(); c.fillStyle=INK; c.beginPath(); c.roundRect(lx-3,ly+9,10,13,2.5); c.fill(); c.fillRect(lx-1,ly+7,6,2.5);
    if(o.lantern>0&&!o.shadow){ c.fillStyle=`rgba(255,214,150,${0.5+o.lantern*0.5})`; c.beginPath(); c.roundRect(lx-1.2,ly+11,6.4,9,1.5); c.fill(); } o._lan=[x+(o.flip?-1:1)*(lx+2)*s, y+(ly+15+bob+cr*9)*s]; }
  reset(); return o._lan; }

/* ---------- the giant ---------- */
function giant(cam,x,y,s,o={}){ setCam(cam,1); c.translate(x,y); c.scale(s,s); const t=o.t||0, wk=o.walk||0, bob=wk?Math.abs(Math.sin(wk))*-9:Math.sin(t*1.3)*-3, rev=o.reveal||0;
  c.lineCap="round"; c.lineJoin="round"; const body=rev>0?(()=>{ const g=c.createRadialGradient(o.lx??160,o.ly??-120,20,o.lx??160,o.ly??-120,520); g.addColorStop(0,`rgb(${Math.round(18+100*rev)},${Math.round(3+44*rev)},${Math.round(4+22*rev)})`); g.addColorStop(1,"#150405"); return g; })():"#0d0203";
  for(const sx of [-1,1]){ const lift=wk?Math.max(0,Math.sin(wk+(sx>0?0:Math.PI)))*16:0; c.fillStyle=rev>0?"#1a0606":"#0d0203"; c.beginPath(); c.ellipse(sx*72,-6-lift,54,20,0,0,7); c.fill(); }
  c.translate(0,bob);
  // left arm (far side)
  c.strokeStyle=rev>0?"#1a0606":"#0d0203"; c.lineWidth=44; c.beginPath(); c.moveTo(-128,-236); c.quadraticCurveTo(-176,-150,-160,-62+Math.sin(wk)*14); c.stroke();
  c.fillStyle=body; c.beginPath(); c.moveTo(-154,0); c.bezierCurveTo(-196,-200,-124,-404,0,-414); c.bezierCurveTo(124,-404,196,-200,154,0); c.closePath(); c.fill();
  c.strokeStyle=RIM; c.lineWidth=2.4; c.beginPath(); c.moveTo(-170,-140); c.bezierCurveTo(-160,-300,-110,-404,0,-414); c.bezierCurveTo(110,-404,160,-300,170,-140); c.stroke();
  // moss tufts and little antlers
  c.fillStyle=rev>0?"#1a0606":"#0d0203"; for(let k=0;k<13;k++){ const a=Math.PI*(1.12+k*0.063), px=Math.cos(a)*150, py=-200+Math.sin(a)*214, L=14+rnd(k)*16; c.beginPath(); c.moveTo(px-7,py+4); c.lineTo(px+Math.cos(a)*L*0.4,py+Math.sin(a)*L-6); c.lineTo(px+7,py+4); c.fill(); }
  c.strokeStyle=rev>0?"#1a0606":"#0d0203"; c.lineWidth=9; for(const sx of [-1,1]){ c.beginPath(); c.moveTo(sx*46,-398); c.quadraticCurveTo(sx*60,-450,sx*86,-478); c.moveTo(sx*62,-446); c.lineTo(sx*52,-486); c.moveTo(sx*74,-464); c.lineTo(sx*104,-470); c.stroke(); }
  if(rev>0.2){ c.fillStyle=`rgba(255,170,120,${0.10*rev})`; c.beginPath(); c.ellipse(20,-150,96,120,0,0,7); c.fill(); }
  // right arm (reaches towards the pup)
  const hx=o.hx??150, hy=o.hy??-70, ex=(140+hx)/2+26, ey=(-236+hy)/2-10; c.strokeStyle=rev>0?"#2a0c08":"#0d0203"; c.lineWidth=44; c.beginPath(); c.moveTo(134,-236); c.quadraticCurveTo(ex,ey,hx,hy); c.stroke();
  c.strokeStyle=RIM; c.lineWidth=2; c.beginPath(); c.moveTo(134,-258); c.quadraticCurveTo(ex+6,ey-22,hx,hy-22); c.stroke();
  const op=o.open||0; c.fillStyle=rev>0?"#2a0c08":"#0d0203"; c.beginPath(); c.arc(hx,hy,27,0,7); c.fill(); c.strokeStyle=rev>0?"#2a0c08":"#0d0203"; c.lineWidth=13; for(let k=0;k<3;k++){ const a=0.5+k*0.42-op*0.55; c.beginPath(); c.moveTo(hx+Math.cos(a)*18,hy+Math.sin(a)*18); c.lineTo(hx+Math.cos(a)*(34+op*10),hy+Math.sin(a)*(34+op*10)-op*8); c.stroke(); }
  // face
  const eo=o.eyes??1, fr=o.friendly||0, ey0=-292; if(eo>0){ for(const sx of [-1,1]){ const ex0=sx*40+ (o.gaze||0)*6; if(fr<0.5){ c.fillStyle="#ffe7d2"; c.beginPath(); c.ellipse(ex0,ey0,16,16*eo,0,0,7); c.fill(); }
      else { c.fillStyle="#ffe9cf"; c.beginPath(); c.ellipse(ex0,ey0,17,17*eo,0,0,7); c.fill(); c.fillStyle="#2a0a06"; c.beginPath(); c.arc(ex0+5,ey0+4,7.5,0,7); c.fill(); c.fillStyle="#fff"; c.beginPath(); c.arc(ex0+7,ey0+1,2.4,0,7); c.fill(); c.strokeStyle="#150405"; c.lineWidth=5; c.beginPath(); c.arc(ex0,ey0+2,19,Math.PI*1.12,Math.PI*1.88); c.stroke(); } }
    if(fr>0.5){ c.strokeStyle="#ffcfa6"; c.lineWidth=4.5; c.beginPath(); c.arc(6,-262,24,Math.PI*0.2,Math.PI*0.8); c.stroke(); c.fillStyle="rgba(255,120,90,.35)"; c.beginPath(); c.ellipse(-62,-262,15,9,0,0,7); c.ellipse(74,-262,15,9,0,0,7); c.fill(); } }
  reset(); return {eyeL:[x-40*s,y+(ey0+bob)*s], eyeR:[x+40*s,y+(ey0+bob)*s], hand:[x+hx*s,y+(hy+bob)*s], head:[x,y+(-300+bob)*s]}; }
function eyesGlow(cam,g,k,red=true){ for(const e of [g.eyeL,g.eyeR]){ const [sx,sy]=scr(cam,e[0],e[1]); glowDot(sx,sy,90*cam.z,0.5*k,red?"255,120,80":WARM); glowDot(sx,sy,26*cam.z,0.9*k,"255,236,214"); } }

/* ---------- little things ---------- */
function fireflies(t,cam,amount,seedT=0){ for(let i=0;i<150;i++){ const on=seg(amount,i/150,i/150+0.12); if(on<=0) continue; const wx=cam.x+(rnd(i*3+1)-0.5)*2200+Math.sin(t*0.6+i)*26, wy=-60-rnd(i*5+2)*900+Math.cos(t*0.5+i*2)*20, par=0.5+rnd(i*7)*0.6; const [sx,sy]=scr(cam,wx,wy,par), tw=0.55+0.45*Math.sin(t*3+i*1.7); if(sx<-40||sx>W+40||sy<-40||sy>H+40) continue; glowDot(sx,sy,26*par,0.5*on*tw); c.fillStyle=`rgba(255,236,190,${on*tw})`; c.beginPath(); c.arc(sx,sy,2.2*par,0,7); c.fill(); } }
function speedLines(t,k){ reset(); c.strokeStyle=`rgba(255,170,130,${0.22*k})`; c.lineWidth=2; for(let i=0;i<26;i++){ const y=rnd(i*3)*H, L=90+rnd(i*5)*220, x=W-((t*(900+rnd(i)*900)+rnd(i*9)*W*2)%(W+L+200)); c.beginPath(); c.moveTo(x,y); c.lineTo(x+L,y); c.stroke(); } }
function dust(cam,x,t0,t){ const u=t-t0; if(u<0||u>1.6) return; setCam(cam,1); for(let i=0;i<12;i++){ const a=Math.PI*(1+rnd(i)*1), r=u*(60+rnd(i*3)*120), px=x+Math.cos(a)*r, py=Math.sin(a)*r*0.6-6; c.fillStyle=`rgba(255,120,80,${0.25*(1-u/1.6)})`; c.beginPath(); c.arc(px,py,10+u*26*rnd(i*7),0,7); c.fill(); } reset(); }
function cliff(cam,x){ setCam(cam,1); c.fillStyle="#0a0102"; c.beginPath(); c.moveTo(x,20); c.lineTo(x+18,-150); c.lineTo(x-14,-330); c.lineTo(x+30,-560); c.lineTo(x+4,-900); c.lineTo(x+60,-2400); c.lineTo(x+3000,-2400); c.lineTo(x+3000,20); c.closePath(); c.fill(); c.strokeStyle="rgba(255,110,70,.35)"; c.lineWidth=2.5; c.beginPath(); c.moveTo(x,10); c.lineTo(x+18,-150); c.lineTo(x-14,-330); c.lineTo(x+30,-560); c.lineTo(x+4,-900); c.stroke(); reset(); }
function caption(text,t,t0,t1,o={}){ const a=Math.min(seg(t,t0,t0+0.25),1-seg(t,t1-0.3,t1)); if(a<=0) return; reset(); const size=o.size||54, lines=text.split("\n"), y0=(o.y||H*0.24)-(lines.length-1)*size*0.62, pop=o.pop?1+0.25*(1-easeOut(seg(t,t0,t0+0.3))):1;
  c.save(); c.translate(W/2,y0); c.scale(pop,pop); c.textAlign="center"; c.textBaseline="middle"; c.font=`800 ${size}px Kanit, sans-serif`; lines.forEach((l,i)=>{ c.shadowColor="rgba(20,0,0,.9)"; c.shadowBlur=18; c.shadowOffsetY=3; c.fillStyle=`rgba(255,236,216,${a})`; c.fillText(l,0,i*size*1.24); }); c.restore(); }
const grain=document.createElement("canvas"); grain.width=grain.height=256; { const g=grain.getContext("2d"), d=g.createImageData(256,256); for(let i=0;i<d.data.length;i+=4){ const n=rnd(i*0.37)*255; d.data[i]=d.data[i+1]=d.data[i+2]=n; d.data[i+3]=26; } g.putImageData(d,0,0); }
function post(t){ reset(); const v=c.createRadialGradient(W/2,H*0.5,W*0.42,W/2,H*0.5,H*0.72); v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.48)"); c.fillStyle=v; c.fillRect(0,0,W,H);
  const f=Math.floor(t*FPS), ox=Math.floor(rnd(f)*256), oy=Math.floor(rnd(f+9)*256); c.globalCompositeOperation="overlay"; for(let x=-ox;x<W;x+=256) for(let y=-oy;y<H;y+=256) c.drawImage(grain,x,y); c.globalCompositeOperation="source-over"; }

/* ---------- dusk world for episode 2 ---------- */
const mix=(a,b,k)=>{ const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)); const A=p(a),B=p(b); return `rgb(${A.map((v,i)=>Math.round(lerp(v,B[i],clamp(k)))).join(",")})`; };
function duskSky(t,cam,sun){ reset(); const n=sun.night; const g=c.createLinearGradient(0,0,0,cam.gy);
  g.addColorStop(0,mix("#4a0f18","#0e0614",n)); g.addColorStop(0.55,mix("#c8452a","#2a0a20",n)); g.addColorStop(1,mix("#ffb066","#4a1426",n)); c.fillStyle=g; c.fillRect(0,0,W,H);
  if(sun.k>0){ const sx=sun.x, sy=sun.y; let h=c.createRadialGradient(sx,sy,6,sx,sy,460); h.addColorStop(0,`rgba(255,220,150,${0.75*sun.k})`); h.addColorStop(1,"rgba(255,150,80,0)"); c.fillStyle=h; c.fillRect(0,0,W,H); c.fillStyle=`rgba(255,236,190,${sun.k})`; c.beginPath(); c.arc(sx,sy,58,0,7); c.fill(); }
  if(sun.moon>0){ const mx=sun.mx,my=sun.my; let h=c.createRadialGradient(mx,my,6,mx,my,300); h.addColorStop(0,`rgba(255,226,210,${0.4*sun.moon})`); h.addColorStop(1,"rgba(255,226,210,0)"); c.fillStyle=h; c.fillRect(0,0,W,H); c.fillStyle=`rgba(255,238,224,${sun.moon})`; c.beginPath(); c.arc(mx,my,40,0,7); c.fill(); c.fillStyle=`rgba(200,150,150,${0.3*sun.moon})`; c.beginPath(); c.arc(mx-10,my-8,8,0,7); c.arc(mx+12,my+10,6,0,7); c.fill();
    for(let i=0;i<60;i++){ const a=sun.moon*(0.5+0.5*Math.sin(t*2+i)); c.fillStyle=`rgba(255,230,220,${a*0.7})`; c.fillRect(rnd(i*3)*W,rnd(i*7)*cam.gy*0.7,2,2); } } }
function hills(cam,par,col,hgt,seed){ setCam(cam,par); const half=W/2/cam.z+400, x0=cam.x*par-half, x1=cam.x*par+half; c.fillStyle=col; c.beginPath(); c.moveTo(x0,40);
  for(let x=x0;x<=x1;x+=24) c.lineTo(x,-hgt*(0.55+0.3*Math.sin(x*0.004+seed)+0.15*Math.sin(x*0.011+seed*2))); c.lineTo(x1,40); c.closePath(); c.fill();
  // tree line on the ridge
  for(let x=Math.floor(x0/40)*40;x<=x1;x+=40){ const y=-hgt*(0.55+0.3*Math.sin(x*0.004+seed)+0.15*Math.sin(x*0.011+seed*2)), h=18+rnd(x*0.1+seed)*26; c.beginPath(); c.moveTo(x-10,y+4); c.lineTo(x,y-h); c.lineTo(x+10,y+4); c.fill(); } }
function field(cam,sun){ setCam(cam,1); const half=W/2/cam.z+80; const g=c.createLinearGradient(0,0,0,700); g.addColorStop(0,mix("#b4522a","#2e0c14",sun.night)); g.addColorStop(1,mix("#5a1a12","#140610",sun.night)); c.fillStyle=g; c.fillRect(cam.x-half,0,half*2,3000);
  c.strokeStyle=mix("#d4703c","#4a1a24",sun.night); c.globalAlpha=0.35; c.lineWidth=2/cam.z; for(let k=1;k<9;k++){ const y=k*k*7; c.beginPath(); c.moveTo(cam.x-half,y); c.lineTo(cam.x+half,y); c.stroke(); } c.globalAlpha=1; }
function bigTree(cam,x,t){ setCam(cam,1); c.fillStyle="#1a0507"; c.beginPath(); c.moveTo(x-46,6); c.bezierCurveTo(x-30,-140,x-50,-300,x-20,-420); c.lineTo(x+22,-420); c.bezierCurveTo(x+46,-300,x+30,-140,x+52,6); c.closePath(); c.fill();
  c.strokeStyle="#1a0507"; c.lineCap="round"; c.lineWidth=18; [[-1,-360,-170,-470],[1,-340,190,-460],[-1,-260,-120,-300]].forEach(([d,y,ex,ey])=>{ c.beginPath(); c.moveTo(x,y); c.quadraticCurveTo(x+ex*0.5,y-30,x+ex,ey); c.stroke(); });
  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, r=170+rnd(i)*60, sway=Math.sin(t*0.9+i)*4; c.beginPath(); c.arc(x+Math.cos(a)*r*1.25+sway,-560+Math.sin(a)*r*0.7,110+rnd(i*3)*50,0,7); c.fill(); }
  c.fillStyle="rgba(20,4,6,.7)"; c.beginPath(); c.ellipse(x+40,24,330,46,0,0,7); c.fill(); reset(); }
function fieldGrass(cam,par,col,t,seed,spacing,size){ grass(cam,par,seed,spacing,size,col,t); }
function scene(t,cam,sun,o={}){ duskSky(t,cam,sun); hills(cam,0.15,mix("#8a2a1c","#1e0a1a",sun.night),280,1); hills(cam,0.35,mix("#5a1612","#160610",sun.night),190,4); field(cam,sun); fieldGrass(cam,0.95,mix("#5a1612","#120408",sun.night),t,3,140,40); if(o.tree) bigTree(cam,o.tree,t); }
const SHK=(sun)=>sun.k>0?lerp(1.1,4.6,sun.low):(sun.moon>0?-1.5:0);
function foxWithShadow(cam,x,s,o,sun,shadeK=0){ const k=SHK(sun), a=(sun.k>0?0.62:0.5*sun.moon)*(1-shadeK); if(a>0.01){ c.globalAlpha=a; pup(cam,x,0,s,{...o,shadow:true,xf:[1,0,-k,-0.42,0,0]}); c.globalAlpha=1; } return pup(cam,x,0,s,o); }
function sunAt(t){ // the sun sinks from 14 % above the horizon to below it; night after 29 s
  const low=ease(seg(t,0,27)), k=1-seg(t,26.5,29.5), night=ease(seg(t,28,33)), moon=ease(seg(t,30,33.5));
  return {low,k,night,moon,x:W*0.18,y:lerp(H*0.3,H*0.575,low),mx:W*0.8,my:lerp(H*0.6,H*0.3,ease(seg(t,30,36)))}; }

/* ---------- the episode ---------- */
const S1=4,S2=8.5,S3=14,S4=19.5,S5=24.5,S6=30.5,S7=36.5,S8=42.5, TREE=2600, STOP=TREE+420;
function draw(t){ t=clamp(t,0,DUR-0.001); reset(); c.clearRect(0,0,W,H); const sun=sunAt(t), GY=H*0.6;
  if(t<S1){ // 1. a walk at sunset, the shadow beside it
    const px=lerp(-260,120,t/S1), cam={x:lerp(-80,120,ease(t/S1)),z:1,gy:GY}; scene(t,cam,sun); foxWithShadow(cam,px,2.3,{walk:1,phase:t*8,t,lantern:0},sun); reset();
    caption("เงาที่ตามมา",t,0.4,3.7,{size:92,y:H*0.24}); caption("ตอนที่ 2",t,0.9,3.7,{size:34,y:H*0.24+92});
  } else if(t<S2){ // 2. it notices the shadow; jumps; the shadow jumps too
    const u=t-S1, px=120, cam={x:px+90,z:1.35,gy:GY+40}, look=u>0.8&&u<2.6?1:0, jump=u>2.6&&u<3.4?Math.sin((u-2.6)/0.8*Math.PI):0; scene(t,cam,sun);
    const o={t,lantern:0,flip:look>0,eyeWide:u>0.8?1:0,earDroop:u>3.6?0.6:0,crouch:u>3.6?0.3:0}; const k=SHK(sun);
    c.globalAlpha=0.62; pup(cam,px,-jump*70*0.24*0,2.3,{...o,shadow:true,xf:[1,0,-k,-0.42,-jump*70*k*1.9*0.0,jump*70*1.9*0.42]}); c.globalAlpha=1; pup(cam,px,-jump*70,2.3,o); reset();
    caption("ทุกเย็น มันพยายาม\nหนีสิ่งเดียวกัน",t,S1+3.8,S2-0.05,{size:54,y:H*0.2});
  } else if(t<S3){ // 3. running; the lower the sun, the longer the shadow
    const u=t-S2, px=120+u*430, cam={x:px+120,z:1.05,gy:GY+Math.cos(t*30)*3}; scene(t,cam,sun); foxWithShadow(cam,px,2.3,{run:1,phase:t*18,t,lantern:0,eyeWide:1,earDroop:0.5,sweat:u>3},sun); reset(); speedLines(t,0.6);
    caption("ยิ่งวิ่ง…\nเงายิ่งยาว",t,S2+2.2,S3-0.1,{size:64,y:H*0.2});
  } else if(t<S4){ // 4. hiding in the tree's shade: the shadow is gone, and so is the light
    const u=t-S3, px=lerp(120+(S3-S2)*430,TREE+40,ease(seg(u,0,1.6))), inShade=ease(seg(u,0.9,1.8)), cam={x:lerp(px+100,TREE+40,ease(seg(u,0,2))),z:lerp(1.05,1.25,ease(seg(u,1,5))),gy:GY+30};
    scene(t,cam,sun,{tree:TREE}); foxWithShadow(cam,px,2.3,{run:u<1.6?1:0,phase:t*18,t,lantern:0,crouch:u>1.6?0.6:0,earDroop:u>1.6?1:0.4,eyeWide:u>1.6?1:0.6,look:u>2.5?Math.sin(u*2):0},sun,inShade); reset();
    const [sx,sy]=scr(cam,px,-50); if(inShade>0){ reset(); c.fillStyle=`rgba(10,2,4,${0.55*inShade})`; c.fillRect(0,0,W,H); glowDot(sx,sy,160,0.12*inShade,"255,150,110"); }
    caption("ในความมืด เงาหายไป",t,S3+1.9,S3+3.6,{size:54,y:H*0.2}); caption("…แต่แสงก็หายไปด้วย",t,S3+3.7,S4-0.05,{size:54,y:H*0.2});
  } else if(t<S5){ // 5. back into the light; it stops running and sits
    const u=t-S4, px=lerp(TREE+40,STOP,ease(seg(u,0.4,2.4))), out=1-ease(seg(u,0.2,1.2)), cam={x:lerp(TREE+40,STOP+60,ease(seg(u,0,2.6))),z:1.25,gy:GY+30};
    scene(t,cam,sun,{tree:TREE}); foxWithShadow(cam,px,2.3,{walk:u<2.4?1:0,phase:t*7,t,lantern:0,sit:ease(seg(u,2.6,3.2)),earDroop:0.3*(1-seg(u,2.6,3.2)),look:0},sun,out*0.8); reset();
    if(out>0){ reset(); c.fillStyle=`rgba(10,2,4,${0.5*out})`; c.fillRect(0,0,W,H); }
    caption("มันเลยหยุดวิ่ง",t,S4+2.8,S5-0.05,{size:60,y:H*0.2});
  } else if(t<S6){ // 6. sitting with its shadow while the sun goes down
    const u=t-S5, cam={x:STOP+120,z:lerp(1.6,1.9,ease(u/6)),gy:GY+80}; scene(t,cam,sun,{}); const k=SHK(sun);
    foxWithShadow(cam,STOP,2.3,{t,lantern:0,sit:1,flip:u>1.5&&u<3.5,wag:u>3.5,eyeWide:0.3},sun); reset();
    caption("แล้วนั่งดูพระอาทิตย์ตก\nไปด้วยกัน",t,S5+1.6,S6-0.1,{size:54,y:H*0.18});
  } else if(t<S7){ // 7. night: the moon rises opposite, the shadow walks on the other side
    const u=t-S6, px=STOP-u*60, cam={x:px-40,z:lerp(1.25,0.95,ease(u/6)),gy:GY}; scene(t,cam,sun);
    const lan=foxWithShadow(cam,px,2.3,{walk:1,phase:t*7,t,lantern:1,flip:true,wag:true,eyeWide:0.3},sun); reset();
    const [lx,ly]=scr(cam,lan[0],lan[1]); darkness(0.45,[{x:lx,y:ly,r:420,k:1,warm:true}]); glowDot(lx,ly,40,0.9); fireflies(t,cam,seg(u,0.5,4));
    caption("สิ่งที่เราวิ่งหนี\nบางครั้งก็แค่ส่วนหนึ่งของเรา",t,S6+1.8,S7-0.1,{size:50,y:H*0.18});
  } else { const u=t-S7, cam={x:STOP-6*60-40,z:0.95,gy:GY}; scene(t,cam,sun); reset(); c.fillStyle=`rgba(10,2,6,${lerp(0.4,0.8,seg(u,0,1))})`; c.fillRect(0,0,W,H); fireflies(t,cam,1);
    if(t<S8){ // psychology note: Jung's shadow
      caption("นักจิตวิทยา คาร์ล ยุง\nเรียกสิ่งนี้ว่า “เงา”",t,S7+0.4,S7+2.9,{size:52,y:H*0.36,pop:1});
      caption("ส่วนของตัวเรา\nที่เราไม่อยากยอมรับ",t,S7+3.0,S8-0.05,{size:52,y:H*0.36});
      caption("ยิ่งหนี มันยิ่งตามมา",t,S7+3.6,S8-0.05,{size:40,y:H*0.36+150});
    } else {
      caption("แต่พอหันไปยอมรับมัน…\nมันก็แค่เงา",t,S8+0.2,DUR+1,{size:54,y:H*0.34,pop:1});
      caption("จบตอนที่ 2",t,S8+1.4,DUR+1,{size:40,y:H*0.34+170}); caption("การ์ตูนวาดด้วยโค้ดทั้งเรื่อง",t,S8+1.8,DUR+1,{size:28,y:H*0.34+225}); } }
  post(t); reset(); const fin=seg(t,0,0.5)*(1-seg(t,DUR-0.5,DUR)); if(fin<1){ c.fillStyle=`rgba(0,0,0,${1-fin})`; c.fillRect(0,0,W,H); }
}
window.draw=draw; window.EP={W,H,FPS,DUR};
window.ready=(document.fonts?Promise.all([document.fonts.load("800 60px Kanit","เงาที่ตามมา"),document.fonts.load("500 30px Kanit","ตอน")]).catch(()=>{}):Promise.resolve()).then(()=>true);
let playing=true,t0=performance.now(),tt=0; function loop(n){ if(playing){ tt=((n-t0)/1000)%DUR; draw(tt); } requestAnimationFrame(loop); }
if(!navigator.webdriver){ window.ready.then(()=>requestAnimationFrame(loop)); addEventListener("keydown",e=>{ if(e.code==="Space"){ playing=!playing; t0=performance.now()-tt*1000; } }); }
</script></body></html>
