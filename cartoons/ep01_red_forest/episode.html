<style>html,body{margin:0;background:#000}canvas{display:block;height:100vh;margin:0 auto}</style>
</head><body><canvas id="cv" width="720" height="1280"></canvas>
<script>
/* "แสงสุดท้ายในป่าแดง" (The Last Light in the Red Forest), episode 1.
   A cartoon drawn entirely by code: every frame is draw(t) on a 2D canvas. No generated images, no AI voice.
   Open this file to watch it (press space to play/pause), or render it with render.js. */
const W=720,H=1280,FPS=24,DUR=39;
const cv=document.getElementById("cv"),c=cv.getContext("2d");
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t);return t*t*(3-2*t);},easeOut=t=>1-Math.pow(1-clamp(t),3),easeIn=t=>Math.pow(clamp(t),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
const INK="#120304",RIM="rgba(255,112,72,.6)",WARM="255,196,120";

/* ---------- camera ---------- */
function setCam(cam,par=1){c.setTransform(cam.z,0,0,cam.z,W/2-cam.x*par*cam.z,cam.gy);}
function scr(cam,wx,wy,par=1){return [W/2+(wx-cam.x*par)*cam.z,cam.gy+wy*cam.z];}
function reset(){c.setTransform(1,0,0,1,0,0);}

/* ---------- world ---------- */
function sky(t,cam,mood){ reset(); const g=c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#3a0708"); g.addColorStop(0.45,"#8f1611"); g.addColorStop(0.72,"#c9321c"); g.addColorStop(1,"#5a0c0b"); c.fillStyle=g; c.fillRect(0,0,W,H);
  const mx=W*0.68-cam.x*0.02,my=H*0.2+(cam.gy-930)*0.15; let h=c.createRadialGradient(mx,my,10,mx,my,420); h.addColorStop(0,"rgba(255,120,80,.55)"); h.addColorStop(1,"rgba(255,90,60,0)"); c.fillStyle=h; c.fillRect(0,0,W,H);
  c.fillStyle="#ff8a5c"; c.beginPath(); c.arc(mx,my,74,0,7); c.fill(); c.fillStyle="rgba(190,50,30,.35)"; c.beginPath(); c.arc(mx-22,my-14,16,0,7); c.arc(mx+26,my+20,11,0,7); c.arc(mx+8,my-34,7,0,7); c.fill();
  c.lineWidth=3; for(let k=0;k<3;k++){ c.strokeStyle=`rgba(255,130,90,${0.32-k*0.09})`; c.beginPath(); c.arc(mx,my,118+k*52+Math.sin(t*0.8+k)*4,Math.PI*0.95,Math.PI*2.05); c.stroke(); } }
function trees(cam,par,seed,spacing,col,wMin,wMax,branch){ setCam(cam,par); const half=W/2/cam.z+300, x0=cam.x*par-half, x1=cam.x*par+half; c.fillStyle=col; c.strokeStyle=col; c.lineCap="round";
  for(let i=Math.floor(x0/spacing)-1;i<=Math.ceil(x1/spacing)+1;i++){ const x=i*spacing+(rnd(i*7+seed)-0.5)*spacing*0.7, w=wMin+rnd(i*3+seed)*(wMax-wMin), lean=(rnd(i*5+seed)-0.5)*90;
    c.beginPath(); c.moveTo(x-w*0.62,30); c.lineTo(x-w*0.4,-300); c.lineTo(x+lean-w*0.28,-2200); c.lineTo(x+lean+w*0.28,-2200); c.lineTo(x+w*0.4,-300); c.lineTo(x+w*0.62,30); c.closePath(); c.fill();
    if(branch){ for(let b=0;b<2;b++){ const by=-360-rnd(i*11+b+seed)*520, dir=rnd(i*13+b+seed)>0.5?1:-1, len=90+rnd(i*17+b)*120; c.lineWidth=w*0.16; c.beginPath(); c.moveTo(x+lean*(-by/2200),by); c.quadraticCurveTo(x+dir*len*0.5,by-30,x+dir*len,by-90-rnd(i+b)*60); c.stroke(); } } } }
function ground(cam){ setCam(cam,1); const half=W/2/cam.z+60; c.fillStyle=INK; c.beginPath(); c.moveTo(cam.x-half,3000); for(let x=cam.x-half;x<=cam.x+half+20;x+=20){ c.lineTo(x,Math.sin(x*0.013)*6+Math.sin(x*0.05)*2); } c.lineTo(cam.x+half,3000); c.closePath(); c.fill();
  c.strokeStyle="rgba(255,110,70,.28)"; c.lineWidth=2/cam.z; c.beginPath(); for(let x=cam.x-half;x<=cam.x+half+20;x+=20){ c.lineTo(x,Math.sin(x*0.013)*6+Math.sin(x*0.05)*2); } c.stroke(); }
function grass(cam,par,seed,spacing,size,col,t){ setCam(cam,par); const half=W/2/cam.z+200, x0=cam.x*par-half, x1=cam.x*par+half; c.fillStyle=col;
  for(let i=Math.floor(x0/spacing)-1;i<=Math.ceil(x1/spacing)+1;i++){ const x=i*spacing+(rnd(i*9+seed)-0.5)*spacing, n=5+Math.floor(rnd(i+seed)*4), s=size*(0.6+rnd(i*2+seed)*0.8);
    for(let k=0;k<n;k++){ const a=(k/(n-1)-0.5)*1.5+Math.sin(t*1.4+i+k)*0.06, L=s*(0.6+rnd(i*31+k)*0.6); c.beginPath(); c.moveTo(x-s*0.07,8); c.quadraticCurveTo(x+Math.sin(a)*L*0.5,-L*0.6,x+Math.sin(a)*L,-Math.cos(a)*L); c.quadraticCurveTo(x+Math.sin(a)*L*0.4,-L*0.45,x+s*0.07,8); c.fill(); } } }
function fog(t,cam,a){ reset(); for(let k=0;k<3;k++){ const y=cam.gy-150+k*70, off=((t*14*(k+1)+k*200-cam.x*0.3)%900+900)%900-450; const g=c.createLinearGradient(0,y-60,0,y+60); g.addColorStop(0,"rgba(255,90,60,0)"); g.addColorStop(0.5,`rgba(255,90,60,${a*(0.12-k*0.025)})`); g.addColorStop(1,"rgba(255,90,60,0)"); c.fillStyle=g; c.fillRect(off-200,y-60,W+400,120); } }
function world(t,cam,o={}){ sky(t,cam); trees(cam,0.22,11,210,"#7c1512",26,60,false); trees(cam,0.45,23,300,"#4b0a0b",44,96,true); fog(t,cam,1);
  trees(cam,0.8,37,420,"#240506",70,150,true); grass(cam,0.9,5,160,70,"#240506",t); if(o.back) o.back(); ground(cam); grass(cam,1,8,120,46,INK,t); }
function foreground(t,cam){ grass(cam,1.5,91,560,200,"#060102",t); reset(); }

/* ---------- lighting ---------- */
const dk=document.createElement("canvas"); dk.width=W; dk.height=H; const dc=dk.getContext("2d");
function darkness(alpha,lights){ lights=[...lights,{x:W*0.66,y:H*0.2,r:560,k:0.5}]; alpha*=0.84; dc.globalCompositeOperation="source-over"; dc.clearRect(0,0,W,H); dc.fillStyle=`rgba(6,1,2,${alpha})`; dc.fillRect(0,0,W,H); dc.globalCompositeOperation="destination-out";
  for(const L of lights){ if(L.k<=0||L.r<=0) continue; const g=dc.createRadialGradient(L.x,L.y,0,L.x,L.y,L.r); g.addColorStop(0,`rgba(0,0,0,${L.k})`); g.addColorStop(0.5,`rgba(0,0,0,${L.k*0.55})`); g.addColorStop(1,"rgba(0,0,0,0)"); dc.fillStyle=g; dc.fillRect(L.x-L.r,L.y-L.r,L.r*2,L.r*2); }
  reset(); c.drawImage(dk,0,0); c.globalCompositeOperation="lighter"; for(const L of lights){ if(!L.warm||L.k<=0) continue; const r=L.r*0.8,g=c.createRadialGradient(L.x,L.y,0,L.x,L.y,r); g.addColorStop(0,`rgba(${WARM},${0.42*L.k})`); g.addColorStop(1,`rgba(${WARM},0)`); c.fillStyle=g; c.fillRect(L.x-r,L.y-r,r*2,r*2); } c.globalCompositeOperation="source-over"; }
function glowDot(x,y,r,a,col=WARM){ c.globalCompositeOperation="lighter"; const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(0.3,`rgba(${col},${a*0.45})`); g.addColorStop(1,`rgba(${col},0)`); c.fillStyle=g; c.fillRect(x-r,y-r,r*2,r*2); c.globalCompositeOperation="source-over"; }

/* ---------- the pup (a small fox) ---------- */
function pup(cam,x,y,s,o={}){ setCam(cam,1); c.translate(x,y); if(o.rot) { c.translate(0,-28*s); c.rotate(o.rot); c.translate(0,28*s); } c.scale(s*(o.flip?-1:1),s);

  reset(); return o._lan; }

/* ---------- the giant ---------- */
function giant(cam,x,y,s,o={}){ setCam(cam,1); c.translate(x,y); c.scale(s,s); const t=o.t||0, wk=o.walk||0, bob=wk?Math.abs(Math.sin(wk))*-9:Math.sin(t*1.3)*-3, rev=o.reveal||0;

  for(const sx of [-1,1]){ const lift=wk?Math.max(0,Math.sin(wk+(sx>0?0:Math.PI)))*16:0; c.fillStyle=rev>0?"#1a0606":"#0d0203"; c.beginPath(); c.ellipse(sx*72,-6-lift,54,20,0,0,7); c.fill(); }

  // moss tufts and little antlers
  c.fillStyle=rev>0?"#1a0606":"#0d0203"; for(let k=0;k<13;k++){ const a=Math.PI*(1.12+k*0.063), px=Math.cos(a)*150, py=-200+Math.sin(a)*214, L=14+rnd(k)*16; c.beginPath(); c.moveTo(px-7,py+4); c.lineTo(px+Math.cos(a)*L*0.4,py+Math.sin(a)*L-6); c.lineTo(px+7,py+4); c.fill(); }
  c.strokeStyle=rev>0?"#1a0606":"#0d0203"; c.lineWidth=9; for(const sx of [-1,1]){ c.beginPath(); c.moveTo(sx*46,-398); c.quadraticCurveTo(sx*60,-450,sx*86,-478); c.moveTo(sx*62,-446); c.lineTo(sx*52,-486); c.moveTo(sx*74,-464); c.lineTo(sx*104,-470); c.stroke(); }

  c.strokeStyle=RIM; c.lineWidth=2; c.beginPath(); c.moveTo(134,-258); c.quadraticCurveTo(ex+6,ey-22,hx,hy-22); c.stroke();
  const op=o.open||0; c.fillStyle=rev>0?"#2a0c08":"#0d0203"; c.beginPath(); c.arc(hx,hy,27,0,7); c.fill(); c.strokeStyle=rev>0?"#2a0c08":"#0d0203"; c.lineWidth=13; for(let k=0;k<3;k++){ const a=0.5+k*0.42-op*0.55; c.beginPath(); c.moveTo(hx+Math.cos(a)*18,hy+Math.sin(a)*18); c.lineTo(hx+Math.cos(a)*(34+op*10),hy+Math.sin(a)*(34+op*10)-op*8); c.stroke(); }
  // face
  const eo=o.eyes??1, fr=o.friendly||0, ey0=-292; if(eo>0){ for(const sx of [-1,1]){ const ex0=sx*40+ (o.gaze||0)*6; if(fr<0.5){ c.fillStyle="#ffe7d2"; c.beginPath(); c.ellipse(ex0,ey0,16,16*eo,0,0,7); c.fill(); }
      else { c.fillStyle="#ffe9cf"; c.beginPath(); c.ellipse(ex0,ey0,17,17*eo,0,0,7); c.fill(); c.fillStyle="#2a0a06"; c.beginPath(); c.arc(ex0+5,ey0+4,7.5,0,7); c.fill(); c.fillStyle="#fff"; c.beginPath(); c.arc(ex0+7,ey0+1,2.4,0,7); c.fill(); c.strokeStyle="#150405"; c.lineWidth=5; c.beginPath(); c.arc(ex0,ey0+2,19,Math.PI*1.12,Math.PI*1.88); c.stroke(); } }
    if(fr>0.5){ c.strokeStyle="#ffcfa6"; c.lineWidth=4.5; c.beginPath(); c.arc(6,-262,24,Math.PI*0.2,Math.PI*0.8); c.stroke(); c.fillStyle="rgba(255,120,90,.35)"; c.beginPath(); c.ellipse(-62,-262,15,9,0,0,7); c.ellipse(74,-262,15,9,0,0,7); c.fill(); } }

function eyesGlow(cam,g,k,red=true){ for(const e of [g.eyeL,g.eyeR]){ const [sx,sy]=scr(cam,e[0],e[1]); glowDot(sx,sy,90*cam.z,0.5*k,red?"255,120,80":WARM); glowDot(sx,sy,26*cam.z,0.9*k,"255,236,214"); } }

/* ---------- little things ---------- */
function fireflies(t,cam,amount,seedT=0){ for(let i=0;i<150;i++){ const on=seg(amount,i/150,i/150+0.12); if(on<=0) continue; const wx=cam.x+(rnd(i*3+1)-0.5)*2200+Math.sin(t*0.6+i)*26, wy=-60-rnd(i*5+2)*900+Math.cos(t*0.5+i*2)*20, par=0.5+rnd(i*7)*0.6; const [sx,sy]=scr(cam,wx,wy,par), tw=0.55+0.45*Math.sin(t*3+i*1.7); if(sx<-40||sx>W+40||sy<-40||sy>H+40) continue; glowDot(sx,sy,26*par,0.5*on*tw); c.fillStyle=`rgba(255,236,190,${on*tw})`; c.beginPath(); c.arc(sx,sy,2.2*par,0,7); c.fill(); } }
function speedLines(t,k){ reset(); c.strokeStyle=`rgba(255,170,130,${0.22*k})`; c.lineWidth=2; for(let i=0;i<26;i++){ const y=rnd(i*3)*H, L=90+rnd(i*5)*220, x=W-((t*(900+rnd(i)*900)+rnd(i*9)*W*2)%(W+L+200)); c.beginPath(); c.moveTo(x,y); c.lineTo(x+L,y); c.stroke(); } }
function dust(cam,x,t0,t){ const u=t-t0; if(u<0||u>1.6) return; setCam(cam,1); for(let i=0;i<12;i++){ const a=Math.PI*(1+rnd(i)*1), r=u*(60+rnd(i*3)*120), px=x+Math.cos(a)*r, py=Math.sin(a)*r*0.6-6; c.fillStyle=`rgba(255,120,80,${0.25*(1-u/1.6)})`; c.beginPath(); c.arc(px,py,10+u*26*rnd(i*7),0,7); c.fill(); } reset(); }
function cliff(cam,x){ setCam(cam,1); c.fillStyle="#0a0102"; c.beginPath(); c.moveTo(x,20); c.lineTo(x+18,-150); c.lineTo(x-14,-330); c.lineTo(x+30,-560); c.lineTo(x+4,-900); c.lineTo(x+60,-2400); c.lineTo(x+3000,-2400); c.lineTo(x+3000,20); c.closePath(); c.fill(); c.strokeStyle="rgba(255,110,70,.35)"; c.lineWidth=2.5; c.beginPath(); c.moveTo(x,10); c.lineTo(x+18,-150); c.lineTo(x-14,-330); c.lineTo(x+30,-560); c.lineTo(x+4,-900); c.stroke(); reset(); }
function caption(text,t,t0,t1,o={}){ const a=Math.min(seg(t,t0,t0+0.25),1-seg(t,t1-0.3,t1)); if(a<=0) return; reset(); const size=o.size||54, lines=text.split("\n"), y0=(o.y||H*0.24)-(lines.length-1)*size*0.62, pop=o.pop?1+0.25*(1-easeOut(seg(t,t0,t0+0.3))):1;

const grain=document.createElement("canvas"); grain.width=grain.height=256; { const g=grain.getContext("2d"), d=g.createImageData(256,256); for(let i=0;i<d.data.length;i+=4){ const n=rnd(i*0.37)*255; d.data[i]=d.data[i+1]=d.data[i+2]=n; d.data[i+3]=26; } g.putImageData(d,0,0); }

    if(face){ const cam={x:GX+20,z:1.9,gy:H*0.5+290*1.2*1.9}; world(t,cam,{back:()=>{ g=giant(cam,GX,0,1.2,{t,eyes:(u>1.2&&u<1.32)?0.1:1,friendly:1,reveal:1,lx:230,ly:-150,hx:222,hy:-196,open:1,gaze:1}); }});
